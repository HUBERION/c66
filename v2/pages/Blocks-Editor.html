<!DOCTYPE html>
<html>
<head>
    <title>Blockbildeditor</title>
	<meta charset="utf-8" />

    <link rel="stylesheet" href="../styles/diagramControls.css" />
    <link rel="stylesheet" href="../styles/dynamicConfigurationManagement.css" />
    <link rel="stylesheet" href="addon.css" />
    <link href="../frameworks/jquery-ui-1.11.4/jquery-ui.css" rel="stylesheet" />
    <link href="../styles/styleTable.css" rel="stylesheet" />

    <script src="../scripts/initializeGlobalObject.js"></script>

    <script src="../frameworks/jquery-ui-1.11.4/external/jquery/jquery.js"></script>
    <script src="../frameworks/jquery-ui-1.11.4/jquery-ui.js"></script>
    <script src="../scripts/jquery.ui.touch-punch.min.js"></script>
    <script src="../scripts/beautify.js"></script>
    <script src="../scripts/contextmenu.js"></script>
    <script src="../scripts/autogrowinput.js"></script>
    <script src="../scripts/uniqueSelector.js"></script>
    <script src="../scripts/timer.js"></script>
    <script src="../scripts/fileSaver.js"></script>
    <script src="../scripts/styleTable.js"></script>
    <script src="../scripts/tabbable.js"></script>

    <script src="../scripts/languagePacks.js"></script>
    <script src="../scripts/configurations.js"></script>
    <script src="../scripts/simulation.js"></script>
    <script src="../scripts/saveAndLoad.js"></script>
    <script src="../scripts/diagramUtil.js"></script>
    <script src="../scripts/diagramControls.js"></script>
    <script src="../scripts/blockDiagramEditor.js"></script>
    <script src="addon.js"></script>
</head>
<body>
    <div id="applicationContainer">
        <div id="statementsToolbar" class="ui-widget-header ui-corner-all">
        </div>
        <br />
        <div id="toolsToolbar" class="ui-widget-header ui-corner-all">
        </div>
        <br />

        <div id="tabs">
            <ul>
                <li><a href="#main">main</a></li>
                <li><a href="">+</a></li>
            </ul>
            <div id="main"></div>
        </div>

        <div id="visualStackContainer">
            <table>
                <thead>
                    <tr><th></th><th></th><th></th></tr>
                </thead>
            </table>
        </div>
        
        <input id="dark_mode" type="button" 
        onclick='dark_mode();' 
        style="display: none;" accessKey="m"></input>
        <input id="show_console" type="button" 
        onclick='show_console_click();' 
        text="show console" style="display: none;" accessKey="#"></input>
        <div id="out" style="display: none; float: left; padding-left: 30px;" class="ui-corner-all">
        Use output: <input type="checkbox" id="use_output"></input>
        <br>
        Add newline: <input type="checkbox" id="add_newline" checked></input>
        <input id="con_clear" type="button" 
        onclick='document.getElementById("con_output").innerHTML="<b>Output:</b>";' 
        value="clear"></input>
        <pre><div id="con_output"><b>Output:</b><br>
</div>
        </pre>
        </div>

    </div>

    <input id="fileChooser" type="file" />
    <a id="fileDownload"></a>
    <div id="configurationsDialog">
        <table>
            <tbody>
                <tr><td><label style="white-space: nowrap"> </label></td><td><input type="number" autocomplete="off" step="500" min="500" /></td></tr>
                <tr><td><label> </label></td><td><input type="checkbox" autocomplete="off" /></td></tr>
                <tr><td><label> </label></td><td><input type="checkbox" autocomplete="off" /></td></tr>
                <tr><td><label> </label></td><td><select></select></td></tr>
            </tbody>
        </table>
        <p><span class="version-label"></span><span> 2.2.1</span></p>
    </div>

    <div id="loadDialog">
        <p> </p>
        <p> </p>
    </div>

    <div id="recoverDialog">
        <p> </p>
    </div>
</body>
</html>
