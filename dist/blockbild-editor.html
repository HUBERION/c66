    }
    const programs = [];

    const typeOf = (ctx, ast) => (ast ? A.typeOf(ast, ctx.scope) : '?');
    const name = (ctx, n) => ctx.rename.get(n) || cobName(n);

    function line(ctx, s) { ctx.lines.push(IND.repeat(ctx.ind) + s); }
    function block(ctx, seq) {
      ctx.ind++;
      const before = ctx.lines.length;
      for (const n of seq) genStmt(ctx, n);
      if (ctx.lines.length === before) line(ctx, 'CONTINUE');
      ctx.ind--;
    }

    /** Hilfsfeld; wird pro Anweisung neu gezählt. Z = Druckfeld, N = Zahl, T = Text (+ -LEN), B = true/false */
    function temp(ctx, kind) {
      ctx.cnt[kind] = (ctx.cnt[kind] || 0) + 1;
      ctx.max[kind] = Math.max(ctx.max[kind] || 0, ctx.cnt[kind]);
      return 'BB-' + kind + ctx.cnt[kind];
    }

    // ------------------------------------------------------------ Programme

    function genFunction(fn) {
      const scope = A.scopeOf(fn);
      const rename = new Map();
      const taken = new Set();
      const suffixes = (t) => (t === 'string' ? ['-LEN'] : t === 'integer[]' ? ['-TAB', '-LEN'] : t === 'string[]' ? ['-TAB', '-LEN', '-EL', '-L'] : []);
      const claim = (base, type) => {
        let b = base;
        let i = 2;
        const free = (x) => !taken.has(x) && suffixes(type).every((s) => !taken.has(x + s));
        while (!free(b)) b = base.slice(0, 20) + '-' + i++;
        taken.add(b);
        for (const s of suffixes(type)) taken.add(b + s);
        return b;
      };
      for (const [n, v] of scope) rename.set(n, claim(n === 'result' && !fn.isMain ? 'RESULT' : cobName(n), v.type));
      const ctx = { fn, scope, rename, ind: 1, lines: [], cnt: {}, max: {}, values: new Map(), valued: new Set() };
      // erste Deklarationen auf oberster Ebene mit einfachem Startwert → VALUE
      const seen = new Set();
      for (const n of fn.body) {
        if (n.kind !== 'decl' || !n.name || seen.has(n.name)) continue;
        seen.add(n.name);
        if (n.vtype.endsWith('[]')) continue;
        const ast = tryParse(n.init);
        const s = ast && strip(ast);
        if (!String(n.init || '').trim()) ctx.values.set(n.name, null);
        else if (n.vtype === 'integer' && s && (s.k === 'num' || (s.k === 'un' && s.op === '-' && strip(s.a).k === 'num'))) {
          const v = A.literalValue(s);
          if (!Number.isInteger(v)) continue;
          ctx.values.set(n.name, String(v));
        } else if (n.vtype === 'string' && s && s.k === 'str' && bytes(s.v) <= 256) {
          const l = litParts(s.v);
          if (l.length > 1) continue;
          ctx.values.set(n.name, l.length ? l[0] : null);
        } else continue;
        ctx.valued.add(n);
      }

      if (!fn.isMain && fn.returnType !== 'void') {
        const dst = fn.returnType === 'string' ? { field: 'RESULT', len: 'RESULT-LEN' } : 'RESULT';
        assign(ctx, dst, fn.returnType, fn.resultInit);
      }
      for (const n of fn.body) genStmt(ctx, n);

      const pid = fn.isMain ? tr('cobolMain') : fnName.get(fn.name);
      const out = ['IDENTIFICATION DIVISION.', 'PROGRAM-ID. ' + pid + (fn.isMain ? '' : ' RECURSIVE') + '.', 'DATA DIVISION.'];
      const local = [];
      const link = [];
      const usingList = [];
      const field = (list, nm, type, value, init) => {
        const v = (x) => (init ? ' VALUE ' + x : '');
        if (type === 'integer') list.push('01 ' + nm + ' ' + NUM + v(value ? value : '0') + '.');
        else if (type === 'string') {
          list.push('01 ' + nm + ' ' + TXT + v(value ? value.op : 'SPACES') + '.');
          list.push('01 ' + nm + '-LEN ' + TLEN + v(value ? value.len : 0) + '.');
        } else {
          list.push('01 ' + nm + '-TAB.');
          if (type === 'integer[]') list.push('   05 ' + nm + ' ' + NUM + ' OCCURS ' + MAXARR + '.');
          else list.push('   05 ' + nm + '-EL OCCURS ' + MAXARR + '.', '      10 ' + nm + ' ' + TXT + '.', '      10 ' + nm + '-L ' + TLEN + '.');
          list.push('01 ' + nm + '-LEN ' + NUM + v(0) + '.');
        }
      };
      const usingOf = (nm, type) => (type === 'integer' ? [nm] : type === 'string' ? [nm, nm + '-LEN'] : [nm + '-TAB', nm + '-LEN']);
      for (const p of fn.params) {
        const nm = name(ctx, p.name || 'p');
        field(link, nm, p.type, null, false);
        usingList.push(...usingOf(nm, p.type));
      }
      if (!fn.isMain && fn.returnType !== 'void') { field(link, 'RESULT', fn.returnType, null, false); usingList.push(...usingOf('RESULT', fn.returnType)); }
      for (const [n, v] of scope) if (v.kind === 'decl') field(local, name(ctx, n), v.type, ctx.values.get(n), true);
      for (const k of ['Z', 'N', 'T', 'B']) {
        for (let i = 1; i <= (ctx.max[k] || 0); i++) {
          if (k === 'T') local.push('01 BB-T' + i + ' ' + TXT + '.', '01 BB-T' + i + '-LEN ' + TLEN + '.');
          else local.push('01 BB-' + k + i + ' ' + (k === 'Z' ? EDIT : k === 'N' ? NUM : 'PIC X(5)') + '.');
        }
      }
      if (local.length) out.push((fn.isMain ? 'WORKING-STORAGE' : 'LOCAL-STORAGE') + ' SECTION.', ...local);
      if (link.length) out.push('LINKAGE SECTION.', ...link);
      out.push('PROCEDURE DIVISION' + (usingList.length ? ' USING ' + usingList.join(' ') : '') + '.');
      out.push(...ctx.lines);
      out.push(IND + (fn.isMain ? 'STOP RUN.' : 'GOBACK.'));
      out.push('END PROGRAM ' + pid + '.');
      programs.push(out.join('\n'));
    }

    // ------------------------------------------------------------ Ausdrücke

    const simpleNum = (s) => s.k === 'num' || s.k === 'id' || (s.k === 'un' && s.op === '-' && strip(s.a).k === 'num');

    function sub(ctx, idx) {
      const s = strip(idx);
      if (s.k === 'num' && Number.isInteger(s.v)) return String(s.v + 1);
      // a[j + 1] → A(J + 2), a[j - 1] → A(J)
      if (s.k === 'bin' && (s.op === '+' || s.op === '-') && strip(s.b).k === 'num' && Number.isInteger(strip(s.b).v)) {
        const k = (s.op === '+' ? strip(s.b).v : -strip(s.b).v) + 1;
        const base = num(ctx, s.a, 5);
        return k === 0 ? base : base + (k > 0 ? ' + ' + k : ' - ' + (-k));
      }
      return num(ctx, idx, 5) + ' + 1';
    }

    /** Text-Variable oder -Element als { field, len }; field ist das ganze (mit Leerzeichen aufgefüllte) Feld. */
    function textRef(ctx, s) {
      if (s.k === 'id') { const nm = name(ctx, s.name); return { field: nm, len: nm + '-LEN' }; }
      const nm = name(ctx, strip(s.obj).name);
      const i = sub(ctx, s.index);
      return { field: nm + '(' + i + ')', len: nm + '-L(' + i + ')' };
    }
    const isTextRef = (ctx, s) => (s.k === 'id' || s.k === 'idx') && typeOf(ctx, s) === 'string';

    /** Rechenausdruck (Zahl). */
    function num(ctx, a, minPrec = 0) {
      const wrap = (s, p) => (p < minPrec ? '(' + s + ')' : s);
      switch (a.k) {
        case 'num': return a.raw;
        case 'paren': return '(' + num(ctx, a.e) + ')';
        case 'id':
          if (typeOf(ctx, a) === 'string') return 'FUNCTION NUMVAL(' + name(ctx, a.name) + ')';
          return name(ctx, a.name);
        case 'idx':
          if (typeOf(ctx, a) === 'string') return 'FUNCTION NUMVAL(' + textRef(ctx, a).field + ')';
          return name(ctx, strip(a.obj).name) + '(' + sub(ctx, a.index) + ')';
        case 'len': {
          const o = strip(a.obj);
          if (A.isArrayType(typeOf(ctx, o))) return name(ctx, o.name) + '-LEN';
          if (isTextRef(ctx, o)) return textRef(ctx, o).len;
          return '(' + sumLens(textParts(ctx, o).map((p) => p.len)) + ')';
        }
        case 'un':
          if (a.op === '+') return num(ctx, a.a, minPrec);
          return strip(a.a).k === 'num' ? wrap('-' + strip(a.a).raw, 7) : '(- ' + num(ctx, a.a, 7) + ')';
        case 'bin': {
          if (a.op === '/') return 'FUNCTION INTEGER-PART(' + num(ctx, a.a, 6) + ' / ' + num(ctx, a.b, 7) + ')';
          if (a.op === '%') return 'FUNCTION REM(' + num(ctx, a.a) + ', ' + num(ctx, a.b) + ')';
          if (a.op === '+' && typeOf(ctx, a) === 'string') return 'FUNCTION NUMVAL(' + textOperand(ctx, a) + ')';
          if (!'+-*'.includes(a.op)) return '0';
          const p = a.op === '*' ? 6 : 5;
          return wrap(num(ctx, a.a, p) + ' ' + a.op + ' ' + num(ctx, a.b, p + 1), p);
        }
        default: return '0';
      }
    }

    function parts(ctx, ast) {
      const s = strip(ast);
      if (s.k === 'bin' && s.op === '+' && typeOf(ctx, s) === 'string') return parts(ctx, s.a).concat(parts(ctx, s.b));
      return [ast];
    }

    /** Teile eines Text-Ausdrucks als { op, len } (Zahlen werden vorher in Druckfelder gerechnet). */
    function textParts(ctx, ast) {
      const out = [];
      for (const p of parts(ctx, ast)) {
        const s = strip(p);
        const t = typeOf(ctx, s);
        if (s.k === 'str') out.push(...litParts(s.v));
        else if (isTextRef(ctx, s)) { const r = textRef(ctx, s); out.push({ op: r.field + '(1:' + r.len + ')', len: r.len }); }
        else if (t === 'bool') {
          const b = temp(ctx, 'B');
          line(ctx, 'IF ' + cond(ctx, s) + ' MOVE "true" TO ' + b + ' ELSE MOVE "false" TO ' + b + ' END-IF');
          out.push({ op: 'FUNCTION TRIM(' + b + ')', len: 'FUNCTION LENGTH(FUNCTION TRIM(' + b + '))' });
        } else {
          const z = temp(ctx, 'Z');
          line(ctx, simpleNum(s) ? 'MOVE ' + num(ctx, s) + ' TO ' + z : 'COMPUTE ' + z + ' = ' + num(ctx, s));
          out.push({ op: 'FUNCTION TRIM(' + z + ')', len: 'FUNCTION LENGTH(FUNCTION TRIM(' + z + '))' });
        }
      }
      return out;
    }

    /** Ein Operand für einen Text-Ausdruck (Feld, Teil oder FUNCTION CONCATENATE). */
    function textOperand(ctx, ast) {
      const s = strip(ast);
      if (isTextRef(ctx, s)) return textRef(ctx, s).field;
      const ps = textParts(ctx, s);
      if (!ps.length) return 'SPACES';
      if (ps.length === 1) return ps[0].op;
      return 'FUNCTION CONCATENATE(' + ps.map((p) => p.op).join(', ') + ')';
    }

    /** Operand für Vergleiche: Texte werden mit Leerzeichen aufgefüllt verglichen. */
    function cmpText(ctx, ast) {
      const s = strip(ast);
      if (s.k === 'str' && s.v === '') return 'SPACES';
      return textOperand(ctx, s);
    }

    const CMP = { '==': '=', '!=': 'NOT =', '<': '<', '<=': '<=', '>': '>', '>=': '>=' };

    function cond(ctx, s, minPrec = 0) {
      const wrap = (x, p) => (p < minPrec ? '(' + x + ')' : x);
      if (s.k === 'paren') return '(' + cond(ctx, s.e) + ')';
      if (s.k === 'un' && s.op === '!') return 'NOT (' + cond(ctx, strip(s.a)) + ')';
      if (s.k === 'bin') {
        if (s.op === '&&') return wrap(cond(ctx, s.a, 2) + ' AND ' + cond(ctx, s.b, 2), 2);
        if (s.op === '||') return wrap(cond(ctx, s.a, 1) + ' OR ' + cond(ctx, s.b, 1), 1);
        if (CMP[s.op]) {
          if (typeOf(ctx, s.a) === 'string' || typeOf(ctx, s.b) === 'string') return cmpText(ctx, s.a) + ' ' + CMP[s.op] + ' ' + cmpText(ctx, s.b);
          return num(ctx, s.a) + ' ' + CMP[s.op] + ' ' + num(ctx, s.b);
        }
      }
      if (typeOf(ctx, s) === 'string') return cmpText(ctx, s) + ' NOT = SPACES';
      return num(ctx, s) + ' NOT = 0';
    }

    function condFrom(ctx, src) {
      const ast = tryParse(src);
      return ast ? cond(ctx, strip(ast)) : '1 = 1';
    }

    /** Text in { field, len } schreiben. */
    function assignText(ctx, dst, ast) {
      const s = ast && strip(ast);
      if (s && isTextRef(ctx, s)) {
        const r = textRef(ctx, s);
        line(ctx, 'MOVE ' + r.field + ' TO ' + dst.field);
        line(ctx, 'MOVE ' + r.len + ' TO ' + dst.len);
        return;
      }
      const ps = s ? textParts(ctx, s) : [];
      if (!ps.length) { line(ctx, 'MOVE SPACES TO ' + dst.field); line(ctx, 'MOVE 0 TO ' + dst.len); return; }
      line(ctx, 'MOVE ' + (ps.length === 1 ? ps[0].op : 'FUNCTION CONCATENATE(' + ps.map((p) => p.op).join(', ') + ')') + ' TO ' + dst.field);
      const sum = sumLens(ps.map((p) => p.len));
      line(ctx, /^\d+$/.test(sum) ? 'MOVE ' + sum + ' TO ' + dst.len : 'COMPUTE ' + dst.len + ' = ' + sum);
    }

    /** Wert zuweisen; dst ist ein Feldname (Zahl) oder { field, len } (Text). */
    function assign(ctx, dst, type, src) {
      const ast = tryParse(src);
      if (type === 'string') { assignText(ctx, dst, ast); return; }
      if (!ast) { line(ctx, 'MOVE 0 TO ' + dst); return; }
      const s = strip(ast);
      if (typeOf(ctx, s) === 'string') { line(ctx, 'COMPUTE ' + dst + ' = FUNCTION NUMVAL(' + textOperand(ctx, s) + ')'); return; }
      if (simpleNum(s)) line(ctx, 'MOVE ' + num(ctx, s) + ' TO ' + dst);
      else line(ctx, 'COMPUTE ' + dst + ' = ' + num(ctx, s));
    }

    /** Ziel einer Zuweisung: Feldname (Zahl) oder { field, len } (Text). */
    function dest(ctx, src) {
      const t = tryTarget(src);
      if (!t) return String(src || '').trim().toUpperCase() || 'X';
      if (typeOf(ctx, t) === 'string') return textRef(ctx, t);
      if (t.k === 'id') return name(ctx, t.name);
      return name(ctx, strip(t.obj).name) + '(' + sub(ctx, t.index) + ')';
    }
    const targetType = (ctx, src) => { const t = tryTarget(src); return t ? typeOf(ctx, t) : '?'; };
    const refs = (d) => (typeof d === 'string' ? d : d.field + ' ' + d.len);

    // ------------------------------------------------------------ Anweisungen

    function genStmt(ctx, n) {
      ctx.cnt = {};
      if (n.comment && n.kind !== 'comment') line(ctx, '*> ' + n.comment.replace(/\s+/g, ' '));
      switch (n.kind) {
        case 'comment':
          for (const l of String(n.text || '').split('\n')) line(ctx, '*> ' + l);
          return;
        case 'decl': {
          const nm = name(ctx, n.name || 'variable');
          if (n.vtype.endsWith('[]')) {
            assign(ctx, nm + '-LEN', 'integer', tryParse(n.length) ? n.length : '0');
            line(ctx, 'INITIALIZE ' + nm + '-TAB');
          } else if (!ctx.valued.has(n)) assign(ctx, n.vtype === 'string' ? { field: nm, len: nm + '-LEN' } : nm, n.vtype, n.init);
          return;
        }
        case 'assign':
          assign(ctx, dest(ctx, n.target), targetType(ctx, n.target), n.expr);
          return;
        case 'input': {
          const tt = targetType(ctx, n.target);
          const p = tryParse(n.prompt);
          const d = dest(ctx, n.target);
          if (tt === 'integer') {
            used.num = true;
            const t = temp(ctx, 'T');
            assignText(ctx, { field: t, len: t + '-LEN' }, p);
            line(ctx, 'CALL "' + HN.prog + '" USING BY CONTENT ' + t + ' ' + t + '-LEN BY REFERENCE ' + d);
          } else {
            const ps = p ? textParts(ctx, strip(p)) : [];
            if (ps.length) line(ctx, 'DISPLAY ' + ps.map((x) => x.op).join(' ') + ' WITH NO ADVANCING');
            line(ctx, 'MOVE SPACES TO ' + d.field);
            line(ctx, 'ACCEPT ' + d.field);
            line(ctx, 'COMPUTE ' + d.len + ' = FUNCTION LENGTH(FUNCTION TRIM(' + d.field + ' TRAILING))');
          }
          return;
        }
        case 'output': {
          const ast = tryParse(n.expr);
          const ps = ast ? textParts(ctx, strip(ast)) : [];
          line(ctx, 'DISPLAY ' + (ps.length ? ps.map((x) => x.op).join(' ') : '""'));
          return;
        }
        case 'if': {
          // WENN … SONST WENN … → EVALUATE TRUE
          const chain = [{ cond: n.cond, body: n.then }];
          let rest = n.else;
          while (rest && rest.length === 1 && rest[0].kind === 'if' && !rest[0].comment) { chain.push({ cond: rest[0].cond, body: rest[0].then }); rest = rest[0].else; }
          if (chain.length > 2) {
            const cs = chain.map((c) => condFrom(ctx, c.cond));
            line(ctx, 'EVALUATE TRUE');
            chain.forEach((c, i) => { line(ctx, 'WHEN ' + cs[i]); block(ctx, c.body); });
            if (rest && rest.length) { line(ctx, 'WHEN OTHER'); block(ctx, rest); }
            line(ctx, 'END-EVALUATE');
            return;
          }
          line(ctx, 'IF ' + condFrom(ctx, n.cond));
          block(ctx, n.then);
          if (n.else && n.else.length) { line(ctx, 'ELSE'); block(ctx, n.else); }
          line(ctx, 'END-IF');
          return;
        }
        case 'while':
        case 'until': {
          const at = ctx.lines.length;
          const c = condFrom(ctx, n.cond);
          const pre = ctx.lines.splice(at);
          if (!pre.length) {
            line(ctx, n.kind === 'while' ? 'PERFORM UNTIL NOT (' + c + ')' : 'PERFORM WITH TEST AFTER UNTIL ' + c);
            block(ctx, n.body);
          } else {
            // Bedingung braucht Hilfsfelder → bei jedem Durchlauf neu berechnen
            const test = () => {
              for (const l of pre) ctx.lines.push(IND + l);
              ctx.ind++; line(ctx, (n.kind === 'while' ? 'IF NOT (' + c + ')' : 'IF ' + c) + ' EXIT PERFORM END-IF'); ctx.ind--;
            };
            line(ctx, 'PERFORM FOREVER');
            if (n.kind === 'while') test();
            block(ctx, n.body);
            if (n.kind === 'until') test();
          }
          line(ctx, 'END-PERFORM');
          return;
        }
        case 'for': {
          const k = dest(ctx, n.counter);
          const operand = (src, dflt) => {
            const ast = tryParse(src);
            if (!ast) return dflt;
            const s = strip(ast);
            if (simpleNum(s)) return num(ctx, s);
            const tmp = temp(ctx, 'N');
            line(ctx, 'COMPUTE ' + tmp + ' = ' + num(ctx, s));
            return tmp;
          };
          const from = operand(n.from, '0');
          const stepAst = tryParse(n.step);
          const lit = stepAst ? A.literalValue(stepAst) : 1;
          const step = typeof lit === 'number' ? String(lit) : operand(n.step, '1');
          const toAst = tryParse(n.to);
          const to = toAst ? num(ctx, strip(toAst)) : '0';
          let until;
          if (typeof lit === 'number') until = k + (lit >= 0 ? ' > ' : ' < ') + to;
          else until = '(' + step + ' > 0 AND ' + k + ' > ' + to + ') OR (' + step + ' < 0 AND ' + k + ' < ' + to + ')';
          line(ctx, 'PERFORM VARYING ' + k + ' FROM ' + from + ' BY ' + step + ' UNTIL ' + until);
          block(ctx, n.body);
          line(ctx, 'END-PERFORM');
          return;
        }
        case 'switch': {
          const sel = tryParse(n.expr);
          const isText = sel && typeOf(ctx, sel) === 'string';
          const val = (a) => (isText ? cmpText(ctx, a) : num(ctx, strip(a)));
          const subj = sel ? val(sel) : '0';
          const vals = n.cases.map((c) => { const v = tryParse(c.value); return v ? val(v) : '0'; });
          line(ctx, 'EVALUATE ' + subj);
          n.cases.forEach((c, i) => { line(ctx, 'WHEN ' + vals[i]); block(ctx, c.body); });
          if (n.else) { line(ctx, 'WHEN OTHER'); block(ctx, n.else); }
          line(ctx, 'END-EVALUATE');
          return;
        }
        case 'call': {
          const callee = program.fns.find((f) => !f.isMain && f.name === n.fn);
          if (!callee) { line(ctx, '*> ' + (n.fn || '?') + '(…)'); return; }
          const using = [];
          callee.params.forEach((p, i) => {
            const src = n.args[i] || '';
            if (A.isArrayType(p.type)) {
              const t = tryTarget(src);
              const nm = t ? name(ctx, t.k === 'id' ? t.name : strip(t.obj).name) : cobName(src);
              using.push('BY REFERENCE ' + nm + '-TAB ' + nm + '-LEN');
            } else if (p.byRef) using.push('BY REFERENCE ' + refs(dest(ctx, src)));
            else {
              const ast = tryParse(src);
              const s = ast && strip(ast);
              if (s && (s.k === 'id' || s.k === 'idx') && typeOf(ctx, s) === p.type) using.push('BY CONTENT ' + refs(p.type === 'string' ? textRef(ctx, s) : num(ctx, s)));
              else if (p.type === 'string') {
                const tmp = temp(ctx, 'T');
                assignText(ctx, { field: tmp, len: tmp + '-LEN' }, ast);
                using.push('BY CONTENT ' + tmp + ' ' + tmp + '-LEN');
              } else {
                const tmp = temp(ctx, 'N');
                assign(ctx, tmp, 'integer', src);
                using.push('BY CONTENT ' + tmp);
              }
            }
          });
          let after = null;
          if (callee.returnType !== 'void') {
            const tt = n.target && n.target.trim() ? targetType(ctx, n.target) : null;
            const d = tt ? dest(ctx, n.target) : null;
            if (tt === callee.returnType) using.push('BY REFERENCE ' + refs(d));
            else if (callee.returnType === 'string') {
              const tmp = temp(ctx, 'T');
              using.push('BY REFERENCE ' + tmp + ' ' + tmp + '-LEN');
              if (d) after = () => line(ctx, 'COMPUTE ' + d + ' = FUNCTION NUMVAL(' + tmp + ')');
            } else {
              const tmp = temp(ctx, 'N');
              using.push('BY REFERENCE ' + tmp);
              if (d) {
                after = () => {
                  const z = temp(ctx, 'Z');
                  line(ctx, 'MOVE ' + tmp + ' TO ' + z);
                  line(ctx, 'MOVE FUNCTION TRIM(' + z + ') TO ' + d.field);
                  line(ctx, 'COMPUTE ' + d.len + ' = FUNCTION LENGTH(FUNCTION TRIM(' + z + '))');
                };
              }
            }
          }
          line(ctx, 'CALL "' + fnName.get(callee.name) + '"' + (using.length ? ' USING ' + using.join(' ') : ''));
          if (after) after();
          return;
        }
        default: return;
      }
    }

    // ------------------------------------------------------------ Zusammenbau

    genFunction(program.fns.find((f) => f.isMain));
    for (const fn of program.fns.filter((f) => !f.isMain)) genFunction(fn);

    if (used.num) {
      programs.push([
        '*> ' + tr('javaHelperNumDoc'),
        'IDENTIFICATION DIVISION.',
        'PROGRAM-ID. ' + HN.prog + '.',
        'DATA DIVISION.',
        'LOCAL-STORAGE SECTION.',

  const BBE = G.BBE = G.BBE || {};
  const { parseCached, parseTarget, strip, walk } = BBE.expr;
  const A = BBE.analyze;
  const M = BBE.model;

  const IND = '    ';
  // Variablen mit Sonderbedeutung in csh/tcsh (dürfen nicht überschrieben werden)
  const SPECIAL = new Set(('addsuffix afsuser ampm anyerror argv autocorrect autoexpand autolist autologout autorehash backslash_quote ' +
    'catalog cdpath cdtohome color colorcat command complete continue continue_args correct csubstnonl cwd dextract dirsfile dirstack ' +
    'dspmbyte dunique echo echo_style edit editors ellipsis euid euser fignore filec gid group highlight histchars histdup histfile ' +
    'histlit history home ignoreeof implicitcd inputmode killdup killring listflags listjobs listlinks listmax listmaxrows loginsh ' +
    'logout mail matchbeep nobeep noclobber noding noglob nokanji nonomatch nostat notify oid owd path printexitvalue prompt prompt2 ' +
    'prompt3 promptchars pushdtohome pushdsilent recexact recognize_only_executables rmstar rprompt savedirs savehist sched shell ' +
    'shlvl status symlinks tcsh term time tperiod tty uid user verbose version visiblebell vimode watch who wordchars ' +
    'if then else endif while end foreach switch case breaksw default endsw goto set setenv unset exit break').split(' '));
  const FOLD = { 'ä': 'ae', 'ö': 'oe', 'ü': 'ue', 'Ä': 'Ae', 'Ö': 'Oe', 'Ü': 'Ue', 'ß': 'ss' };
  const CMP = ['==', '!=', '<', '<=', '>', '>='];
  const AWK_NUM = "'NR == 1 && /^[ \\t]*[-+]?[0-9]+[ \\t]*$/ { printf \"%d\\n\", $1; exit } NR == 1 { print \"x\"; exit } END { if (NR == 0) print \"eof\" }'";

  const tryParse = (src) => { try { return parseCached(String(src || '').trim()); } catch (e) { return null; } };
  const tryTarget = (src) => { try { return parseTarget(String(src || '').trim()); } catch (e) { return null; } };

  /** Gültiger csh-Name (ASCII, Umlaute umschreiben). */
  function cshName(n) {
    let s = String(n || '').replace(/[äöüÄÖÜß]/g, (c) => FOLD[c]).normalize('NFD').replace(/[\u0300-\u036f]/g, '');
    s = s.replace(/[^A-Za-z0-9_]/g, '_');
    if (!/^[A-Za-z_]/.test(s)) s = 'v' + s;
    return s || 'v';
  }

  /** Text-Literal in '…' ('  → '\'' , ! → \! , Zeilenumbruch → \ + Umbruch). */
  function lit(s) {
    s = String(s);
    if (s === '') return "''";
    return "'" + s.replace(/'/g, "'\\''").replace(/!/g, '\\!').replace(/\n/g, '\\\n') + "'";
  }

  /** Kommentartext für eine #-Zeile. */
  const commentText = (s) => String(s).replace(/\s+/g, ' ').replace(/\\+$/, '').trim();

  function hasCall(seq) {
    let hit = false;
    M.walkSeq(seq, (n) => { if (n.kind === 'call') hit = true; });
    return hit;
  }
  const stmtHasCall = (n) => hasCall([n]);

  function generate(program, opts = {}) {
    const tr = opts.t || ((k) => k);
    const mainFn = program.fns.find((f) => f.isMain);
    const subs = program.fns.filter((f) => !f.isMain);
    const byName = new Map(subs.map((f) => [f.name, f]));

    // ------------------------------------------------------------ Namen
    const taken = new Set(['bb_ret', 'bb_stack', 'bb_r', 'bb_n', 'bb_m', 'bb_c', 'bb_e', 'bb_top', 'bb_line', 'bb_num', 'bb_eof', 'bb_prompt', 'bb_len', 'bb_reader']);
    const labels = new Set(['bb_return']);
    // BSD-csh erlaubt höchstens 30 Zeichen lange Variablennamen
    const claim = (base, set) => {
      if (SPECIAL.has(base) || /^bb_/.test(base)) base = base + '_';
      base = base.slice(0, 30);
      let b = base;
      let i = 2;
      while (set.has(b) || SPECIAL.has(b)) b = base.slice(0, 27) + '_' + i++;
      set.add(b);
      return b;
    };
    const fnLabel = new Map();
    for (const f of subs) fnLabel.set(f.name, claim(cshName(f.name), labels));
    const varNames = new Map(); // fn -> Map(name -> cshName)
    for (const f of program.fns) {
      const m = new Map();
      const pfx = f.isMain ? '' : fnLabel.get(f.name) + '_';
      for (const n of A.scopeOf(f).keys()) m.set(n, claim(pfx + cshName(n), taken));
      varNames.set(f, m);
    }

    // ------------------------------------------------------------ Aufrufgraph: wer erreicht wen?
    const calls = new Map(program.fns.map((f) => [f, new Set()]));
    for (const f of program.fns) M.walkSeq(f.body, (n) => { if (n.kind === 'call' && byName.has(n.fn)) calls.get(f).add(byName.get(n.fn)); });
    const reach = new Map();
    for (const f of program.fns) {
      const seen = new Set();
      const todo = [f];
      while (todo.length) { const x = todo.pop(); for (const y of calls.get(x)) if (!seen.has(y)) { seen.add(y); todo.push(y); } }
      reach.set(f, seen);
    }
    // Aufrufer muss seine Variablen sichern, wenn der Aufgerufene ihn wieder erreichen kann
    const needSave = (caller, callee) => !caller.isMain && (callee === caller || reach.get(callee).has(caller));
    const saving = new Set(subs.filter((f) => [...calls.get(f)].some((g) => needSave(f, g))));
    const used = { stack: saving.size > 0, ret: subs.length > 0 };

    let labelNo = 0;
    let retNo = 0;
    let idxNo = 0;
    const newLabel = (kind) => 'bb_' + kind + (++labelNo);

    const typeOf = (ctx, ast) => (ast ? A.typeOf(ast, ctx.scope) : '?');
    const name = (ctx, n) => ctx.names.get(n) || cshName(n);

    function line(ctx, s) { ctx.lines.push(s === '' ? '' : IND.repeat(ctx.ind) + s); }
    function label(ctx, l) { ctx.lines.push(IND.repeat(ctx.ind) + l + ':'); }
    function temp(ctx) { ctx.cnt++; return 'bb_t' + ctx.cnt; }
    /** Code, den fn erzeugt, abfangen (für Bedingungen, die jedes Mal neu berechnet werden). */
    function capture(ctx, fn) {
      const at = ctx.lines.length;
      const r = fn();
      return { r, pre: ctx.lines.splice(at) };
    }

    // ------------------------------------------------------------ Ausdrücke

    /** Array-Index für csh (ab 1). */
    function index(ctx, ast) {
      const s = strip(ast);
      if (s.k === 'num' && Number.isInteger(s.v)) return String(s.v + 1);
      const t = temp(ctx);
      line(ctx, '@ ' + t + ' = ( ' + num(ctx, s) + ' + 1 )');
      return '$' + t;
    }

    /** Text (Wortteil) → Zahl über awk (wie Number() für ganze Zahlen). */
    function toNum(ctx, frag) {
      const t = temp(ctx);
      line(ctx, 'set ' + t + " = `printf '%s\\n' " + frag + " | awk '{ printf \"%d\\n\", $1 }'`");
      return '$' + t;
    }

    function hasFloat(ast) {
      let hit = false;
      walk(ast, (x) => { if (x.k === 'num' && !Number.isInteger(x.v)) hit = true; });
      return hit;
    }

    /** Rechnung mit Kommazahl (z. B. betrag * 1.25): csh kann nur ganze Zahlen → awk rechnet, Ergebnis abgeschnitten wie in C. */
    function floatNum(ctx, a) {
      const ax = (e) => {
        const s = strip(e);
        if (!hasFloat(s)) {
          const v = num(ctx, s);
          if (/^-?\d+$/.test(v)) return '(' + v + ')';
          if (/^\$[A-Za-z_][A-Za-z0-9_]*$/.test(v)) return "('\"" + v + "\"')";
          const t = temp(ctx);
          line(ctx, '@ ' + t + ' = ' + v);
          return "('\"$" + t + "\"')";
        }
        if (s.k === 'num') return s.raw;
        if (s.k === 'un') return s.op === '-' ? '(-' + ax(s.a) + ')' : ax(s.a);
        if (s.k === 'bin' && '+-*/%'.includes(s.op)) return '(' + ax(s.a) + ' ' + s.op + ' ' + ax(s.b) + ')';
        return '(' + num(ctx, s) + ')';
      };
      const x = ax(a);
      const t = temp(ctx);
      line(ctx, 'set ' + t + " = `awk 'BEGIN { printf \"%d\\n\", int(" + x + ") }'`");
      return '$' + t;
    }

    function boolNum(ctx, s) {
      const c = cond(ctx, s);
      const t = temp(ctx);
      line(ctx, 'set ' + t + ' = 0');
      line(ctx, 'if ( ' + c + ' ) set ' + t + ' = 1');
      return '$' + t;
    }

    /** Rechenausdruck für @ und if (Wörter mit Leerzeichen, jede Rechnung geklammert). */
    function num(ctx, a) {
      switch (a.k) {
        case 'num': return String(Math.trunc(a.v));
        case 'str': return toNum(ctx, lit(a.v));
        case 'paren': return num(ctx, a.e);
        case 'id': {
          const t = typeOf(ctx, a);
          if (t === 'string') return toNum(ctx, '$' + name(ctx, a.name) + ':q');
          return '$' + name(ctx, a.name);
        }
        case 'idx': {
          const ref = '$' + name(ctx, strip(a.obj).name) + '[' + index(ctx, a.index) + ']';
          if (typeOf(ctx, a) === 'string') return toNum(ctx, '"' + ref + ':s/x//"');
          return ref;
        }
        case 'len': {
          const o = strip(a.obj);
          if (A.isArrayType(typeOf(ctx, o))) return '$#' + name(ctx, o.name);
          const frag = text(ctx, o);
          const t = temp(ctx);
          line(ctx, 'set ' + t + " = `expr x" + frag + " : '.*'`");
          line(ctx, '@ ' + t + ' = ( $' + t + ' - 1 )');
          return '$' + t;
        }
        case 'un': {
          if (a.op === '!') return boolNum(ctx, a);
          const s = strip(a.a);
          if (a.op === '+') return num(ctx, a.a);
          if (s.k === 'num') return String(-Math.trunc(s.v));
          return '( 0 - ' + num(ctx, a.a) + ' )';
        }
        case 'bin': {
          if (a.op === '+' && typeOf(ctx, a) === 'string') return toNum(ctx, text(ctx, a));
          if ('+-*/%'.includes(a.op) && hasFloat(a)) return floatNum(ctx, a);
          if ('+-*/%'.includes(a.op)) return '( ' + num(ctx, a.a) + ' ' + a.op + ' ' + num(ctx, a.b) + ' )';
          return boolNum(ctx, a);
        }
        default: return '0';
      }
    }

    function parts(ctx, ast) {
      const s = strip(ast);
      if (s.k === 'bin' && s.op === '+' && typeOf(ctx, s) === 'string') return parts(ctx, s.a).concat(parts(ctx, s.b));
      return [s];
    }

    /** Text-Ausdruck als ein csh-Wort aus aneinandergehängten Teilen: 'Summe: '$s:q
     *  ($s:q statt "$s": "…" scheitert in csh an Zeilenumbrüchen im Wert). */
    function text(ctx, ast) {
      let out = '';
      for (const s of parts(ctx, ast)) {
        const t = typeOf(ctx, s);
        if (s.k === 'str') { if (s.v !== '') out += lit(s.v); continue; }
        if (s.k === 'num') { out += lit(BBE.interp ? BBE.interp.show(s.v) : String(s.v)); continue; }
        if (s.k === 'id' && t !== 'bool') { out += '$' + name(ctx, s.name) + (t === 'string' ? ':q' : ''); continue; }
        if (s.k === 'idx' && t !== 'bool') { out += '$' + name(ctx, strip(s.obj).name) + '[' + index(ctx, s.index) + ']' + (t === 'string' ? ':s/x//:q' : ''); continue; }
        if (t === 'bool') {
          const c = cond(ctx, s);
          const v = temp(ctx);
          line(ctx, 'set ' + v + ' = false');
          line(ctx, 'if ( ' + c + ' ) set ' + v + ' = true');
          out += '$' + v;
          continue;
        }
        const e = num(ctx, s);
        if (/^\$[A-Za-z_][A-Za-z0-9_]*$/.test(e)) { out += e; continue; }
        const v = temp(ctx);
        line(ctx, '@ ' + v + ' = ' + e);
        out += '$' + v;
      }
      return out || "''";
    }

    const risky = (ast) => {
      let hit = false;
      walk(ast, (x) => { if (x.k === 'idx' || x.k === 'len' || (x.k === 'bin' && (x.op === '/' || x.op === '%'))) hit = true; });
      return hit;
    };

    /** Bedingung für if ( … ) / while ( … ); Hilfsrechnungen stehen davor. */
    function cond(ctx, a) {
      const s = strip(a);
      if (s.k === 'un' && s.op === '!') return '! ( ' + cond(ctx, s.a) + ' )';
      if (s.k === 'bin' && (s.op === '&&' || s.op === '||')) {
        const ca = cond(ctx, s.a);
        const { r: cb, pre } = capture(ctx, () => cond(ctx, s.b));
        if (!pre.length && !risky(s.b)) return '( ' + ca + ' ' + s.op + ' ' + cb + ' )';
        // csh setzt alle Variablen ein, bevor es rechnet → rechte Seite nur berechnen, wenn nötig
        const t = temp(ctx);
        const and = s.op === '&&';
        line(ctx, 'set ' + t + ' = ' + (and ? '0' : '1'));
        line(ctx, 'if ( ' + (and ? ca : '! ( ' + ca + ' )') + ' ) then');
        for (const l of pre) ctx.lines.push(IND + l);
        line(ctx, IND + 'if ( ' + (and ? cb : '! ( ' + cb + ' )') + ' ) set ' + t + ' = ' + (and ? '1' : '0'));
        line(ctx, 'endif');
        return '$' + t + ' == 1';
      }
      if (s.k === 'bin' && CMP.includes(s.op)) {
        if (typeOf(ctx, s.a) === 'string' || typeOf(ctx, s.b) === 'string') {
          const x = text(ctx, s.a);
          const y = text(ctx, s.b);
          if (s.op === '==' || s.op === '!=') return 'x' + x + ' ' + s.op + ' x' + y;
          // Textvergleich <, > … über expr (Byte-Reihenfolge wie in der Simulation)
          const t = temp(ctx);
          line(ctx, 'env LC_ALL=C expr x' + x + " '" + s.op + "' x" + y + ' > /dev/null');
          line(ctx, 'set ' + t + ' = $status');
          return '$' + t + ' == 0';
        }
        return num(ctx, s.a) + ' ' + s.op + ' ' + num(ctx, s.b);
      }
      if (typeOf(ctx, s) === 'string') return 'x' + text(ctx, s) + ' != x';
      return num(ctx, s) + ' != 0';
    }

    function condFrom(ctx, src) {
      const ast = tryParse(src);
      return ast ? cond(ctx, ast) : '1';
    }

    // ------------------------------------------------------------ Zuweisungen

    /** Ziel: { name, idx } (idx = csh-Index oder null) und Typ. */
    function dest(ctx, src) {
      const t = tryTarget(src);
      if (!t) return { name: cshName(String(src || '').trim() || 'x'), idx: null, type: '?' };
      if (t.k === 'id') return { name: name(ctx, t.name), idx: null, type: typeOf(ctx, t) };
      return { name: name(ctx, t.obj.name), idx: index(ctx, t.index), type: typeOf(ctx, t) };
    }
    const lhs = (d) => d.name + (d.idx ? '[' + d.idx + ']' : '');
    // Elemente von Text-Arrays tragen ein x davor (csh verliert leere Wörter in Listen)
    const rhs = (d) => '$' + d.name + (d.idx ? '[' + d.idx + ']' + (d.type === 'string' ? ':s/x//' : '') : '') + ':q';

    function setNum(ctx, d, e) {
      if (!d.idx && /^-?\d+$/.test(e)) line(ctx, 'set ' + d.name + ' = ' + e);
      else line(ctx, '@ ' + lhs(d) + ' = ' + e);
    }
    function setText(ctx, d, w) { line(ctx, 'set ' + lhs(d) + ' = ' + (d.idx ? 'x' : '') + w); }

    /** Wert eines Ausdrucks (Quelltext) im Typ type an d zuweisen. */
    function assign(ctx, d, type, src) {
      const ast = tryParse(src);
      if (type === 'string') { setText(ctx, d, ast ? text(ctx, ast) : "''"); return; }
      setNum(ctx, d, ast ? num(ctx, ast) : '0');
    }

    // ------------------------------------------------------------ Anweisungen

    function genSeq(ctx, seq) { for (const n of seq) genStmt(ctx, n); }
    function block(ctx, seq) { ctx.ind++; genSeq(ctx, seq); ctx.ind--; }

    function genStmt(ctx, n) {
      ctx.cnt = 0;
      if (n.comment && n.kind !== 'comment') line(ctx, '# ' + commentText(n.comment));
      const g = stmtHasCall(n);
      switch (n.kind) {
        case 'comment':
          for (const l of String(n.text || '').split('\n')) line(ctx, '# ' + commentText(l));
          return;
        case 'decl': {
          const d = { name: name(ctx, n.name || 'variable'), idx: null };
          if (A.isArrayType(n.vtype)) {
            const fill = n.vtype === 'integer[]' ? '0' : 'x';
            const lenAst = tryParse(n.length);
            const lv = lenAst ? A.literalValue(lenAst) : 0;
            if (typeof lv === 'number' && Number.isInteger(lv) && lv >= 0 && lv <= 16) {
              line(ctx, 'set ' + d.name + ' = (' + (' ' + fill).repeat(lv) + ' )');
            } else {
              line(ctx, '@ bb_len = ' + (lenAst ? num(ctx, lenAst) : '0'));
              line(ctx, 'set ' + d.name + ' = ( )');
              line(ctx, 'while ( $#' + d.name + ' < $bb_len )');
              line(ctx, IND + 'set ' + d.name + ' = ( $' + d.name + ':q ' + fill + ' )');
              line(ctx, 'end');
            }
          } else assign(ctx, d, n.vtype, n.init);
          return;
        }
        case 'assign': {
          const d = dest(ctx, n.target);
          assign(ctx, d, d.type, n.expr);
          return;
        }
        case 'input': {
          const d = dest(ctx, n.target);
          const p = tryParse(n.prompt);
          const prompt = p ? text(ctx, p) : null;
          if (d.type === 'integer') {
            // Zahl: so lange fragen, bis eine ganze Zahl kommt (bei Dateiende 0)
            if (prompt) line(ctx, 'set bb_prompt = ' + prompt);
            line(ctx, 'while ( 1 )');
            ctx.ind++;
            if (prompt) line(ctx, "printf '%s' $bb_prompt:q");
            // sh liest genau eine Zeile, awk prüft sie: Zahl, x (keine Zahl) oder eof (Dateiende)
            line(ctx, "set bb_num = `sh -c 'read -r l || [ -n \"$l\" ] && printf \"%s\\n\" \"$l\"' | awk " + AWK_NUM + '`');
            line(ctx, 'if ( "$bb_num" == eof ) set bb_num = 0');
            line(ctx, 'if ( "$bb_num" != x ) break');
            line(ctx, "printf '%s\\n' " + lit(tr('javaNeedInt')));
            ctx.ind--;
            line(ctx, 'end');
            setNum(ctx, d, '$bb_num');
          } else {
            if (prompt) line(ctx, "printf '%s' " + prompt);
            // $< liest eine Zeile (am Dateiende leer)
            if (d.type === 'string') setText(ctx, d, '"$<"');
            else { line(ctx, 'set bb_line = "$<"'); setNum(ctx, d, toNum(ctx, '$bb_line:q')); }
          }
          return;
        }
        case 'output': {
          const ast = tryParse(n.expr);
          line(ctx, "printf '%s\\n' " + (ast ? text(ctx, ast) : "''"));
          return;
        }
        case 'if': return g ? genIfGoto(ctx, n) : genIf(ctx, n);
        case 'while':
        case 'until':
          return g ? genLoopGoto(ctx, n) : genLoop(ctx, n);
        case 'for': return genFor(ctx, n, g);
        case 'switch': return genSwitch(ctx, n, g);
        case 'call': return genCall(ctx, n);
        default: return;
      }
    }

    function genIf(ctx, n) {
      line(ctx, 'if ( ' + condFrom(ctx, n.cond) + ' ) then');
      block(ctx, n.then);
      let rest = n.else;
      // SONST WENN → else if, solange die Bedingung keine Hilfsrechnung braucht
      while (rest && rest.length === 1 && rest[0].kind === 'if' && !rest[0].comment) {
        ctx.cnt = 0;
        const { r: c, pre } = capture(ctx, () => condFrom(ctx, rest[0].cond));
        if (pre.length) break;
        line(ctx, 'else if ( ' + c + ' ) then');
        block(ctx, rest[0].then);
        rest = rest[0].else;
      }
      if (rest && rest.length) { line(ctx, 'else'); block(ctx, rest); }
      line(ctx, 'endif');
    }

    function genIfGoto(ctx, n) {
      const lElse = newLabel('else');
      const lEnd = lElse.replace('else', 'endif');
      const hasElse = n.else && n.else.length;
      line(ctx, 'if ( ! ( ' + condFrom(ctx, n.cond) + ' ) ) goto ' + (hasElse ? lElse : lEnd));
      block(ctx, n.then);
      if (hasElse) {
        ctx.ind++; line(ctx, 'goto ' + lEnd); ctx.ind--;
        label(ctx, lElse); block(ctx, n.else);
      }
      label(ctx, lEnd);
    }

    function genLoop(ctx, n) {
      ctx.cnt = 0;
      const { r: c, pre } = capture(ctx, () => condFrom(ctx, n.cond));
      if (n.kind === 'while' && !pre.length) {
        line(ctx, 'while ( ' + c + ' )');
        block(ctx, n.body);
        line(ctx, 'end');
        return;
      }
      line(ctx, 'while ( 1 )');
      ctx.ind++;
      const test = () => {
        for (const l of pre) ctx.lines.push(IND + l);
        line(ctx, 'if ( ' + (n.kind === 'while' ? '! ( ' + c + ' )' : c) + ' ) break');
      };
      if (n.kind === 'while') test();
      genSeq(ctx, n.body);
      if (n.kind === 'until') test();
      ctx.ind--;
      line(ctx, 'end');
    }

    function genLoopGoto(ctx, n) {
      const lTop = newLabel(n.kind === 'while' ? 'while' : 'repeat');
      const lEnd = lTop.replace(/^bb_[a-z]+/, 'bb_end');
      ctx.cnt = 0;
      const { r: c, pre } = capture(ctx, () => condFrom(ctx, n.cond));
      label(ctx, lTop);
      ctx.ind++;
      if (n.kind === 'while') {
        for (const l of pre) ctx.lines.push(IND + l);
        line(ctx, 'if ( ! ( ' + c + ' ) ) goto ' + lEnd);
        genSeq(ctx, n.body);
        line(ctx, 'goto ' + lTop);
        ctx.ind--;
        label(ctx, lEnd);
      } else {
        genSeq(ctx, n.body);
        for (const l of pre) ctx.lines.push(IND + l);
        line(ctx, 'if ( ! ( ' + c + ' ) ) goto ' + lTop);
        ctx.ind--;
      }
    }

    function genFor(ctx, n, g) {
      const d = dest(ctx, n.counter);
      const fromAst = tryParse(n.from);
      setNum(ctx, d, fromAst ? num(ctx, fromAst) : '0');
      const k = d.idx ? '$' + lhs(d) : '$' + d.name;
      const stepAst = tryParse(n.step);
      const lit = stepAst ? A.literalValue(stepAst) : 1;
      const toAst = tryParse(n.to);
      ctx.cnt = 0;
      const { r: c, pre } = capture(ctx, () => {
        const to = toAst ? num(ctx, toAst) : '0';
        if (typeof lit === 'number') return k + (lit >= 0 ? ' <= ' : ' >= ') + to;
        const s = num(ctx, stepAst);
        return '( ( ' + s + ' > 0 && ' + k + ' <= ' + to + ' ) || ( ' + s + ' < 0 && ' + k + ' >= ' + to + ' ) )';
      });
      const inc = () => {
        if (typeof lit === 'number' && !d.idx) {
          const v = Math.trunc(lit);

  // UTF-8-Bytes wieder als JS-Text (für die Quelldatei, die als UTF-8 gespeichert wird)
  function Buffer_from(bytes) {
    try { return decodeURIComponent(bytes.map((b) => '%' + b.toString(16).padStart(2, '0')).join('')); } catch (e) {
      return bytes.map((b) => String.fromCharCode(b)).join('');
    }
  }

  function generate(program, opts = {}) {
    const tr = opts.t || ((k) => k);
    const kw = (k) => tr('kw.' + k);
    const typeName = (t) => tr('type.' + t);

    // ------------------------------------------------------------ Texte (Daten)
    const lits = new Map();
    function lit(s) {
      s = String(s);
      if (!lits.has(s)) {
        let bytes = utf8(s);
        // höchstens 255 Bytes, keine halben UTF-8-Zeichen
        if (bytes.length > 255) { bytes = bytes.slice(0, 255); while (bytes.length && (bytes[bytes.length - 1] & 0xC0) === 0x80) bytes.pop(); if (bytes.length && bytes[bytes.length - 1] >= 0xC0) bytes.pop(); }
        lits.set(s, { label: 'txt_' + (lits.size + 1), bytes });
      }
      return lits.get(s).label;
    }
    const shortText = (s) => { const t = JSON.stringify(String(s)); return t.length > 40 ? t.slice(0, 37) + '…"' : t; };

    // ------------------------------------------------------------ Unterprogramm-Namen
    const procName = new Map();
    const usedProc = new Set();
    for (const f of program.fns) {
      if (f.isMain) { procName.set(f, 'main'); continue; }
      let n = 'fn_' + asciiName(f.name);
      while (usedProc.has(n)) n += '_';
      usedProc.add(n);
      procName.set(f, n);
    }
    const findFn = (name) => program.fns.find((f) => !f.isMain && f.name === name);

    // ------------------------------------------------------------ Ausgabezeilen
    const I = (ctx, ins, cmt) => ctx.lines.push(TAB + (cmt ? ins.padEnd(28) + '; ' + cmt : ins));
    const Lbl = (ctx, l, cmt) => ctx.lines.push(cmt ? (l + ':').padEnd(36) + '; ' + cmt : l + ':');
    const Cm = (ctx, text) => ctx.lines.push(TAB + '; ' + text);
    const newId = (ctx) => ++ctx.lab;

    /** springt nach target, wenn die Bedingung cc NICHT erfüllt ist (8086: bedingte Sprünge reichen nur ±127 Byte). */
    function jmpUnless(ctx, cc, target) {
      const ok = '.ok' + newId(ctx);
      I(ctx, 'j' + cc + ' ' + ok);
      I(ctx, 'jmp ' + target);
      Lbl(ctx, ok);
    }

    // ------------------------------------------------------------ Typen (mit Hilfsfeldern slot/sslot)
    function ty(ctx, a) {
      if (!a) return '?';
      switch (a.k) {
        case 'slot': return 'integer';
        case 'sslot': return 'string';
        case 'num': return 'integer';
        case 'str': return 'string';
        case 'paren': return ty(ctx, a.e);
        case 'id': { const v = ctx.scope.get(a.name); return v ? v.type : '?'; }
        case 'idx': return A.elemType(ty(ctx, a.obj));
        case 'len': return 'integer';
        case 'un': return a.op === '!' ? 'bool' : 'integer';
        case 'bin': {
          if (a.op === '+') {
            const x = ty(ctx, a.a), y = ty(ctx, a.b);
            if (x === 'string' || y === 'string') return 'string';
            if (x === '?' || y === '?') return '?';
            return 'integer';
          }
          if ('-*/%'.includes(a.op)) return 'integer';
          return 'bool';
        }
        default: return '?';
      }
    }

    // ------------------------------------------------------------ Hilfsspeicher (pro Anweisung neu gezählt)
    function tmpStr(ctx) { ctx.tcnt++; ctx.tmax = Math.max(ctx.tmax, ctx.tcnt); return 'tmp_' + ctx.tcnt; }
    function tmpWord(ctx) { ctx.wcnt++; ctx.wmax = Math.max(ctx.wmax, ctx.wcnt); return 'wrd_' + ctx.wcnt; }

    const varOf = (ctx, name) => ctx.vars.get(name);

    // ------------------------------------------------------------ Texte: Adressen und Aufbau

    /** einfacher Text: Literal, Text-Variable oder Hilfspuffer – Adresse ohne Nebenwirkungen in jedes Register */
    function isSimpleStr(ctx, a) {
      const s = strip(a);
      if (!s) return false;
      if (s.k === 'str' || s.k === 'sslot') return true;
      if (s.k === 'id') { const v = varOf(ctx, s.name); return !!v && v.type === 'string' && (v.mode === 'buf' || v.mode === 'ref'); }
      return false;
    }
    function strSimple(ctx, a, reg) {
      const s = strip(a);
      if (s.k === 'str') { I(ctx, 'mov ' + reg + ', ' + lit(s.v), shortText(s.v)); return; }
      if (s.k === 'sslot') { I(ctx, 'lea ' + reg + ', [' + s.def + ']'); return; }
      const v = varOf(ctx, s.name);
      if (v.mode === 'ref') I(ctx, 'mov ' + reg + ', [' + v.def + ']', s.name + ' (' + tr('asmAddr') + ')');
      else I(ctx, 'lea ' + reg + ', [' + v.def + ']', s.name);
    }

    /** Adresse eines Text-Ausdrucks nach SI (zusammengesetzte Texte werden in einem Hilfspuffer gebaut). */
    function strOperand(ctx, a) {
      const s = strip(a);
      if (isSimpleStr(ctx, s)) { strSimple(ctx, s, 'si'); return; }
      if (s.k === 'idx' && ty(ctx, s) === 'string') { elemAddr(ctx, s); I(ctx, 'mov si, bx'); return; }
      const t = tmpStr(ctx);
      buildStr(ctx, s, t);
      I(ctx, 'lea si, [' + t + ']');
    }

    /** Teile einer Text-Verkettung von links nach rechts. */
    function parts(ctx, ast) {
      const s = strip(ast);
      if (s && s.k === 'bin' && s.op === '+' && ty(ctx, s) === 'string') return parts(ctx, s.a).concat(parts(ctx, s.b));
      return [s];
    }

    /** Text-Ausdruck in den Rahmen-Puffer dst bauen (dst = Name aus %define). from = erster Teil, der angehängt wird. */
    function buildStr(ctx, ast, dst, from = 0) {
      const ps = ast ? parts(ctx, ast) : [];
      let diOk = false;
      const di = () => { if (!diOk) I(ctx, 'lea di, [' + dst + ']'); diOk = true; };
      if (from === 0) { di(); I(ctx, 'mov byte [di], 0', tr('asmEmpty')); }
      for (const p of ps.slice(from)) {
        const t = ty(ctx, p);
        if (t === 'string' && isSimpleStr(ctx, p)) { strSimple(ctx, p, 'si'); di(); I(ctx, 'call str_append'); }
        else if (t === 'string') { strOperand(ctx, p); diOk = false; di(); I(ctx, 'call str_append'); }
        else if (t === 'bool') { boolValue(ctx, p); diOk = false; di(); I(ctx, 'call str_append_bool'); }
        else {
          const simple = p.k === 'num' || p.k === 'slot' || (p.k === 'id' && varOf(ctx, p.name) && varOf(ctx, p.name).mode !== 'buf');
          num(ctx, p);
          if (!simple) diOk = false;
          di();
          I(ctx, 'call str_append_num');
        }
      }
    }

    const mentions = (ast, name) => { let hit = false; walk(ast, (x) => { if (x.k === 'id' && x.name === name) hit = true; }); return hit; };

    // ------------------------------------------------------------ Zahlen

    /** Operand, der direkt in einem Befehl stehen kann (Konstante oder Wort im Rahmen). */
    function simpleOperand(ctx, a) {
      const s = strip(a);
      if (!s) return null;
      if (s.k === 'num') return String(word(s.v));
      if (s.k === 'slot') return 'word [' + s.def + ']';
      if (s.k === 'un' && s.op === '-' && strip(s.a).k === 'num') return String(word(-strip(s.a).v));
      if (s.k === 'id') { const v = varOf(ctx, s.name); if (v && v.type === 'integer' && v.mode === 'val') return 'word [' + v.def + ']'; }
      return null;
    }

    /** Kommazahl-Literal als gekürzter Bruch { p, q } (beide 16 Bit), sonst null */
    function frac(a) {
      const s = strip(a);
      if (!s || s.k !== 'num' || Number.isInteger(s.v)) return null;
      let q = 1;
      while (!Number.isInteger(Math.round(s.v * q * 1e9) / 1e9) && q < 10000) q *= 10;
      let p = Math.round(s.v * q);
      const gcd = (x, y) => (y ? gcd(y, x % y) : x);
      const g = gcd(Math.abs(p), q) || 1;
      p /= g; q /= g;
      if (Math.abs(p) > 32767 || p === 0) return null;
      return { p, q, raw: s.raw };
    }

    /** Zahl-Ausdruck → AX */
    function num(ctx, a) {
      const s = strip(a);
      if (!s) { I(ctx, 'xor ax, ax'); return; }
      const t = ty(ctx, s);
      if (t === 'string') { strOperand(ctx, s); I(ctx, 'call str_to_num', tr('asmTextToNum')); return; }
      if (t === 'bool') { boolValue(ctx, s); return; }
      switch (s.k) {
        case 'num': I(ctx, 'mov ax, ' + word(s.v)); return;
        case 'slot': I(ctx, 'mov ax, [' + s.def + ']'); return;
        case 'id': {
          const v = varOf(ctx, s.name);
          if (!v || A.isArrayType(v.type)) { I(ctx, 'xor ax, ax', '? ' + s.name); return; }
          if (v.mode === 'ref') { I(ctx, 'mov bx, [' + v.def + ']', s.name + ' (' + tr('asmAddr') + ')'); I(ctx, 'mov ax, [bx]'); }
          else I(ctx, 'mov ax, [' + v.def + ']', s.name);
          return;
        }
        case 'idx': elemAddr(ctx, s); I(ctx, 'mov ax, [bx]'); return;
        case 'len': {
          const o = strip(s.obj);
          if (A.isArrayType(ty(ctx, o))) { arrPtr(ctx, o); I(ctx, 'mov ax, [bx]', tr('asmLength')); return; }
          strOperand(ctx, o);
          I(ctx, 'mov al, [si]', tr('asmLength'));
          I(ctx, 'mov ah, 0');
          return;
        }
        case 'un':
          num(ctx, s.a);
          if (s.op === '-') I(ctx, 'neg ax');
          return;
        case 'bin': {
          // Kommazahl als Faktor (x * 1.25, x / 2.5): als Bruch p/q mit 32-Bit-Zwischenergebnis (DX:AX), wie (int) in C
          const fb = frac(s.b), fa = frac(s.a);
          if ((s.op === '*' && (fa || fb)) || (s.op === '/' && fb)) {
            const f = s.op === '*' ? (fb || fa) : fb;
            num(ctx, s.op === '*' && !fb ? s.b : s.a);
            const [m, d] = s.op === '*' ? [f.p, f.q] : [f.q, f.p];
            I(ctx, 'mov bx, ' + m);
            I(ctx, 'imul bx', 'dx:ax = ax * ' + m);
            I(ctx, 'mov bx, ' + d);
            I(ctx, 'idiv bx', 'ax = dx:ax / ' + d + '  (' + (s.op === '*' ? '* ' : '/ ') + f.raw + ')');
            return;
          }
          num(ctx, s.a);
          const so = simpleOperand(ctx, s.b);
          if ((s.op === '+' || s.op === '-') && so) { I(ctx, (s.op === '+' ? 'add' : 'sub') + ' ax, ' + so); return; }
          if (so) I(ctx, 'mov bx, ' + so);
          else { I(ctx, 'push ax'); num(ctx, s.b); I(ctx, 'mov bx, ax'); I(ctx, 'pop ax'); }
          switch (s.op) {
            case '+': I(ctx, 'add ax, bx'); return;
            case '-': I(ctx, 'sub ax, bx'); return;
            case '*': I(ctx, 'imul bx', 'dx:ax = ax * bx'); return;
            case '/': I(ctx, 'call num_div', 'ax = ax / bx'); return;
            case '%': I(ctx, 'call num_div', 'dx = ax % bx'); I(ctx, 'mov ax, dx'); return;
            default: I(ctx, 'xor ax, ax'); return;
          }
        }
        default: I(ctx, 'xor ax, ax'); return;
      }
    }

    /** Wahrheitswert → AX (1 = true, 0 = false) */
    function boolValue(ctx, a) {
      const id = newId(ctx);
      cjump(ctx, a, '.f' + id, false);
      I(ctx, 'mov ax, 1');
      I(ctx, 'jmp short .b' + id);
      Lbl(ctx, '.f' + id);
      I(ctx, 'xor ax, ax');
      Lbl(ctx, '.b' + id);
    }

    /** Vergleich: setzt die Flags, liefert die Sprungbedingung für "wahr". */
    function compare(ctx, s) {
      const ta = ty(ctx, s.a), tb = ty(ctx, s.b);
      if (ta === 'string' && tb === 'string') {
        if (isSimpleStr(ctx, s.b)) { strOperand(ctx, s.a); strSimple(ctx, s.b, 'di'); }
        else { strOperand(ctx, s.b); I(ctx, 'push si'); strOperand(ctx, s.a); I(ctx, 'pop di'); }
        I(ctx, 'call str_cmp', tr('asmCmp'));
        I(ctx, 'cmp ax, 0');
        return CC[s.op];
      }
      num(ctx, s.a);
      const so = simpleOperand(ctx, s.b);
      if (so) I(ctx, 'cmp ax, ' + so);
      else { I(ctx, 'push ax'); num(ctx, s.b); I(ctx, 'mov bx, ax'); I(ctx, 'pop ax'); I(ctx, 'cmp ax, bx'); }
      return CC[s.op];
    }

    /** Springt nach label, wenn der Wahrheitswert von a gleich when ist; sonst geht es weiter. */
    function cjump(ctx, a, label, when) {
      const s = strip(a);
      if (!s) { if (!when) return; I(ctx, 'jmp ' + label); return; }
      if (s.k === 'un' && s.op === '!') { cjump(ctx, s.a, label, !when); return; }
      if (s.k === 'bin' && (s.op === '&&' || s.op === '||')) {
        const and = s.op === '&&';
        if (and !== when) { cjump(ctx, s.a, label, when); cjump(ctx, s.b, label, when); return; }
        const skip = '.s' + newId(ctx);
        cjump(ctx, s.a, skip, !when);
        cjump(ctx, s.b, label, when);
        Lbl(ctx, skip);
        return;
      }
      let cc;
      if (s.k === 'bin' && CC[s.op]) cc = compare(ctx, s);
      else if (ty(ctx, s) === 'string') { strOperand(ctx, s); I(ctx, 'cmp byte [si], 0', tr('asmNotEmpty')); cc = 'ne'; }
      else { num(ctx, s); I(ctx, 'cmp ax, 0'); cc = 'ne'; }
      jmpUnless(ctx, when ? INV[cc] : cc, label);
    }

    // ------------------------------------------------------------ Arrays und Ziele

    /** Adresse des Arrays (Kopf: Länge) nach BX */
    function arrPtr(ctx, o) {
      const v = o && o.k === 'id' ? varOf(ctx, o.name) : null;
      if (!v || v.mode !== 'arr') { I(ctx, 'xor bx, bx', '?'); return; }
      I(ctx, 'mov bx, [' + v.def + ']', o.name);
    }

    /** Adresse von a[i] nach BX (mit Prüfung der Grenzen) */
    function elemAddr(ctx, s) {
      num(ctx, s.index);
      const o = strip(s.obj);
      arrPtr(ctx, o);
      const t = ty(ctx, o);
      I(ctx, 'call ' + (t === 'string[]' ? 'arr_text_elem' : 'arr_num_elem'), 'bx = &' + (o.name || '?') + '[ax]');
    }

    /** Adresse eines Ziels (Variable oder Element) in reg */
    function dstAddr(ctx, tgt, reg) {
      if (tgt.k === 'idx') { elemAddr(ctx, tgt); if (reg !== 'bx') I(ctx, 'mov ' + reg + ', bx'); return; }
      const v = varOf(ctx, tgt.name);
      if (!v) { I(ctx, 'mov ' + reg + ', scratch', '? ' + tgt.name); return; }
      if (v.mode === 'ref') I(ctx, 'mov ' + reg + ', [' + v.def + ']', tgt.name + ' (' + tr('asmAddr') + ')');
      else I(ctx, 'lea ' + reg + ', [' + v.def + ']', tgt.name);
    }

    /** AX in ein Zahl-Ziel schreiben */
    function storeNum(ctx, tgt) {
      if (tgt.k === 'id') {
        const v = varOf(ctx, tgt.name);
        if (!v) { Cm(ctx, '? ' + tgt.name); return; }
        if (v.mode === 'ref') { I(ctx, 'mov bx, [' + v.def + ']', tgt.name + ' (' + tr('asmAddr') + ')'); I(ctx, 'mov [bx], ax'); }
        else I(ctx, 'mov [' + v.def + '], ax', tgt.name);
        return;
      }
      I(ctx, 'push ax');
      elemAddr(ctx, tgt);
      I(ctx, 'pop ax');
      I(ctx, 'mov [bx], ax');
    }

    /** Text-Ausdruck in ein Text-Ziel schreiben */
    function storeStr(ctx, tgt, expr) {
      const v = tgt.k === 'id' ? varOf(ctx, tgt.name) : null;
      if (tgt.k === 'id' && !v) { Cm(ctx, '? ' + tgt.name); return; }
      if (v && v.mode === 'buf') {
        if (!expr) { I(ctx, 'mov byte [' + v.def + '], 0'); return; }
        if (isSimpleStr(ctx, expr)) { strSimple(ctx, expr, 'si'); I(ctx, 'lea di, [' + v.def + ']', tgt.name); I(ctx, 'call str_copy'); return; }
        const ps = ty(ctx, expr) === 'string' ? parts(ctx, expr) : [];
        if (ps.length > 1 && ps[0].k === 'id' && ps[0].name === tgt.name && !ps.slice(1).some((p) => mentions(p, tgt.name))) {
          buildStr(ctx, expr, v.def, 1);   // s = s + … → direkt anhängen
          return;
        }
        if (!mentions(expr, tgt.name)) { buildStr(ctx, expr, v.def); return; }
        const t = tmpStr(ctx);
        buildStr(ctx, expr, t);
        I(ctx, 'lea si, [' + t + ']');
        I(ctx, 'lea di, [' + v.def + ']', tgt.name);
        I(ctx, 'call str_copy');
        return;
      }
      // InOut-Text, result oder Array-Element: erst fertig bauen, dann kopieren
      if (expr && isSimpleStr(ctx, expr)) {
        strSimple(ctx, expr, 'si');
        if (tgt.k === 'idx') { I(ctx, 'push si'); dstAddr(ctx, tgt, 'di'); I(ctx, 'pop si'); } else dstAddr(ctx, tgt, 'di');
        I(ctx, 'call str_copy');
        return;
      }
      const t = tmpStr(ctx);
      buildStr(ctx, expr, t);
      dstAddr(ctx, tgt, 'di');
      I(ctx, 'lea si, [' + t + ']');
      I(ctx, 'call str_copy');
    }

    /** Zuweisung ziel = ausdruck (Typ des Ziels entscheidet) */
    function assignTo(ctx, tgt, expr) {
      if (!tgt) { Cm(ctx, '?'); return; }
      const tt = ty(ctx, tgt);
      if (tt === 'string') storeStr(ctx, tgt, expr);
      else if (A.isArrayType(tt)) Cm(ctx, '?');
      else { num(ctx, expr); storeNum(ctx, tgt); }
    }

    /** Ausgabe ohne Zwischenpuffer: jeden Teil einzeln ausgeben */
    function printParts(ctx, ast) {
      for (const p of parts(ctx, ast)) {
        const t = ty(ctx, p);
        if (t === 'string') { strOperand(ctx, p); I(ctx, 'call print_str'); }
        else if (t === 'bool') { boolValue(ctx, p); I(ctx, 'call print_bool'); }
        else { num(ctx, p); I(ctx, 'call print_num'); }
      }
    }

    // ------------------------------------------------------------ Anweisungen

    function seq(ctx, list) { for (const n of list || []) genStmt(ctx, n); }

    function genStmt(ctx, n) {
      ctx.tcnt = 0;
      ctx.wcnt = 0;
      if (n.kind !== 'comment') ctx.lines.push('');
      if (n.comment && n.kind !== 'comment') Cm(ctx, oneLine(n.comment));
      switch (n.kind) {
        case 'comment':
          for (const l of String(n.text || '').split('\n')) Cm(ctx, l);
          return;
        case 'decl': {
          const isArr = A.isArrayType(n.vtype);
          Cm(ctx, kw('decl') + ' ' + typeName(n.vtype) + ' ' + (n.name || '?') + (isArr ? '[' + oneLine(n.length) + ']' : ' = ' + oneLine(n.init)));
          const v = varOf(ctx, n.name);
          if (!v) return;
          if (isArr) {
            if (v.mode !== 'arr') return;
            num(ctx, tryParse(n.length));
            I(ctx, 'mov cx, ' + (n.vtype === 'string[]' ? STRSIZE : 2), tr('asmElemSize'));
            I(ctx, 'mov bx, [' + v.def + ']', tr('asmOldArray'));
            I(ctx, 'call arr_new');
            I(ctx, 'mov [' + v.def + '], bx', n.name);
            return;
          }
          assignTo(ctx, { k: 'id', name: n.name }, tryParse(n.init));
          return;
        }
        case 'assign':
          Cm(ctx, oneLine(n.target) + ' = ' + oneLine(n.expr));
          assignTo(ctx, tryTarget(n.target), tryParse(n.expr));
          return;
        case 'input': {
          Cm(ctx, kw('input') + ' ' + (oneLine(n.prompt) ? oneLine(n.prompt) + ' → ' : '') + oneLine(n.target));
          const tgt = tryTarget(n.target);
          if (!tgt) return;
          const p = tryParse(n.prompt);
          if (ty(ctx, tgt) === 'string') {
            if (p) printParts(ctx, p);
            dstAddr(ctx, tgt, 'di');
            I(ctx, 'call read_line', tr('asmReadLine'));
          } else {
            if (!p) I(ctx, 'xor si, si');
            else if (isSimpleStr(ctx, p)) strSimple(ctx, p, 'si');
            else { const t = tmpStr(ctx); buildStr(ctx, p, t); I(ctx, 'lea si, [' + t + ']'); }
            I(ctx, 'call read_num', tr('asmReadNum'));
            storeNum(ctx, tgt);
          }
          return;
        }
        case 'output': {
          Cm(ctx, kw('output') + ' ' + oneLine(n.expr));
          const ast = tryParse(n.expr);
          if (ast) printParts(ctx, ast);
          I(ctx, 'call print_newline');
          return;
        }
        case 'if': {
          const id = newId(ctx);
          const hasElse = n.else && n.else.length;
          Cm(ctx, kw('if') + ' ' + oneLine(n.cond));
          cjump(ctx, tryParse(n.cond), hasElse ? '.if' + id + '_else' : '.if' + id + '_end', false);
          seq(ctx, n.then);
          if (hasElse) {
            I(ctx, 'jmp .if' + id + '_end');
            Lbl(ctx, '.if' + id + '_else', kw('else'));
            seq(ctx, n.else);
          }
          Lbl(ctx, '.if' + id + '_end');
          return;
        }
        case 'while': {
          const id = newId(ctx);
          Lbl(ctx, '.while' + id, kw('while') + ' ' + oneLine(n.cond));
          cjump(ctx, tryParse(n.cond), '.while' + id + '_end', false);
          seq(ctx, n.body);
          I(ctx, 'jmp .while' + id);
          Lbl(ctx, '.while' + id + '_end');
          return;
        }
        case 'until': {
          const id = newId(ctx);
          Lbl(ctx, '.repeat' + id, kw('until'));
          seq(ctx, n.body);
          ctx.tcnt = 0;
          ctx.wcnt = 0;
          ctx.lines.push('');
          Cm(ctx, kw('untilFoot') + ' ' + oneLine(n.cond));
          cjump(ctx, tryParse(n.cond), '.repeat' + id, false);
          return;
        }
        case 'for': {
          const id = newId(ctx);
          const L = '.for' + id;
          Cm(ctx, kw('for') + ' ' + oneLine(n.counter) + ' ' + kw('forFrom') + ' ' + oneLine(n.from) + ' ' + kw('forTo') + ' ' + oneLine(n.to) + ' ' + kw('forStep') + ' ' + oneLine(n.step));
          const k = tryTarget(n.counter);
          if (!k) return;
          num(ctx, tryParse(n.from));
          storeNum(ctx, k);
          const stepAst = tryParse(n.step) || { k: 'num', v: 1, raw: '1' };
          const to = tryParse(n.to);
          const lv = A.literalValue(stepAst);
          // Bedingung bei jedem Durchlauf neu prüfen (Ende kann sich ändern, wie in C)
          const test = (cc) => {
            num(ctx, to);
            I(ctx, 'push ax', kw('forTo'));
            num(ctx, k);
            I(ctx, 'pop bx');
            I(ctx, 'cmp ax, bx');
            jmpUnless(ctx, cc, L + '_end');
          };
          Lbl(ctx, L);
          if (typeof lv === 'number') test(lv >= 0 ? 'le' : 'ge');
          else {
            num(ctx, stepAst);
            I(ctx, 'cmp ax, 0', kw('forStep') + ' < 0 ?');
            jmpUnless(ctx, 'ge', L + '_down');
            test('le');
            I(ctx, 'jmp ' + L + '_body');
            Lbl(ctx, L + '_down');
            test('ge');
            Lbl(ctx, L + '_body');
          }
          seq(ctx, n.body);
          ctx.tcnt = 0;
          ctx.wcnt = 0;
          ctx.lines.push('');
          const kv = k.k === 'id' && varOf(ctx, k.name) && varOf(ctx, k.name).mode === 'val' ? varOf(ctx, k.name) : null;
          if (typeof lv === 'number') Cm(ctx, oneLine(n.counter) + ' = ' + oneLine(n.counter) + (lv < 0 ? ' - ' + word(-lv) : ' + ' + word(lv)));
          else Cm(ctx, oneLine(n.counter) + ' = ' + oneLine(n.counter) + ' + (' + oneLine(n.step) + ')');
          if (kv && lv === 1) I(ctx, 'inc word [' + kv.def + ']', k.name);
          else if (kv && lv === -1) I(ctx, 'dec word [' + kv.def + ']', k.name);
          else if (kv && typeof lv === 'number') I(ctx, 'add word [' + kv.def + '], ' + word(lv), k.name);
          else if (kv) { num(ctx, stepAst); I(ctx, 'add [' + kv.def + '], ax', k.name); }
          else { num(ctx, stepAst); I(ctx, 'push ax'); num(ctx, k); I(ctx, 'pop bx'); I(ctx, 'add ax, bx'); storeNum(ctx, k); }
          I(ctx, 'jmp ' + L);
          Lbl(ctx, L + '_end');
          return;
        }
        case 'switch': {
          const id = newId(ctx);
          const L = '.switch' + id;
          Cm(ctx, kw('switch') + ' ' + oneLine(n.expr));
          let sel = tryParse(n.expr);
          if (sel && !isSimpleStr(ctx, sel) && !simpleOperand(ctx, sel)) {
            // Wert einmal berechnen und merken
            if (ty(ctx, sel) === 'string') { const t = tmpStr(ctx); buildStr(ctx, sel, t); sel = { k: 'sslot', def: t }; }
            else { const w = tmpWord(ctx); num(ctx, sel); I(ctx, 'mov [' + w + '], ax'); sel = { k: 'slot', def: w }; }
          }
          n.cases.forEach((c, i) => {
            const next = L + '_' + (i + 1);
            ctx.lines.push('');
            Cm(ctx, kw('case') + ' ' + oneLine(c.value));
            const v = tryParse(c.value);
            if (sel && v) cjump(ctx, { k: 'bin', op: '==', a: sel, b: v }, next, false);
            seq(ctx, c.body);
            I(ctx, 'jmp ' + L + '_end');
            Lbl(ctx, next);
          });
          if (n.else) { Cm(ctx, kw('else')); seq(ctx, n.else); }
          Lbl(ctx, L + '_end');
          return;
        }
        case 'call': {
          const callee = findFn(n.fn);
          Cm(ctx, kw('call') + ' ' + (n.target && n.target.trim() && callee && callee.returnType !== 'void' ? oneLine(n.target) + ' = ' : '') + (n.fn || '?') + '(' + (n.args || []).map(oneLine).join(', ') + ')');
          if (!callee) return;
          let res = null;
          if (callee.returnType === 'string') {
            res = tmpStr(ctx);
            I(ctx, 'lea ax, [' + res + ']', tr('asmResultBuf'));
            I(ctx, 'push ax');
          }
          callee.params.forEach((p, i) => {
            const src = (n.args || [])[i] || '';
            const pn = p.name || '?';
            if (A.isArrayType(p.type)) {
              const t = tryTarget(src);
              const v = t && t.k === 'id' ? varOf(ctx, t.name) : null;
              if (v && v.mode === 'arr') I(ctx, 'push word [' + v.def + ']', pn + ' = ' + t.name);
              else { I(ctx, 'xor ax, ax'); I(ctx, 'push ax'); }
              return;
            }
            if (p.byRef) {
              const t = tryTarget(src);
              if (t && (t.k === 'idx' || varOf(ctx, t.name))) {
                if (t.k === 'id' && varOf(ctx, t.name).mode === 'ref') I(ctx, 'push word [' + varOf(ctx, t.name).def + ']', pn + ' = ' + t.name + ' (' + tr('asmAddr') + ')');
                else { dstAddr(ctx, t, 'ax'); I(ctx, 'push ax', pn + ' = &' + oneLine(src)); }
              } else {
                // kein Ziel: Wert in einen Hilfsspeicher legen und dessen Adresse übergeben
                if (p.type === 'string') { const tt = tmpStr(ctx); buildStr(ctx, tryParse(src), tt); I(ctx, 'lea ax, [' + tt + ']'); }
                else { const w = tmpWord(ctx); num(ctx, tryParse(src)); I(ctx, 'mov [' + w + '], ax'); I(ctx, 'lea ax, [' + w + ']'); }
                I(ctx, 'push ax');
              }
              return;
            }
            const ast = tryParse(src);
            if (p.type === 'string') {
              if (ast && isSimpleStr(ctx, ast)) { strSimple(ctx, ast, 'ax'); I(ctx, 'push ax', pn); }
              else { const tt = tmpStr(ctx); buildStr(ctx, ast, tt); I(ctx, 'lea ax, [' + tt + ']'); I(ctx, 'push ax', pn); }
              return;
            }
            const so = simpleOperand(ctx, ast);
            if (so && so.startsWith('word')) { I(ctx, 'push ' + so, pn); return; }
            num(ctx, ast);
            I(ctx, 'push ax', pn);
          });
          I(ctx, 'call ' + procName.get(callee));
          if (callee.returnType !== 'void' && n.target && n.target.trim()) {
            const tgt = tryTarget(n.target);
            if (!tgt) return;
            if (callee.returnType === 'string') assignTo(ctx, tgt, { k: 'sslot', def: res });
            else if (ty(ctx, tgt) === 'string') { const w = tmpWord(ctx); I(ctx, 'mov [' + w + '], ax', tr('asmResult')); assignTo(ctx, tgt, { k: 'slot', def: w }); }
            else storeNum(ctx, tgt);
          }
          return;
        }
        default: return;
      }
    }

    // ------------------------------------------------------------ Unterprogramme
    const procs = [];

    function genFunction(fn) {
      const scope = A.scopeOf(fn);
      const ctx = { fn, scope, vars: new Map(), lines: [], lab: 0, tcnt: 0, tmax: 0, wcnt: 0, wmax: 0 };
      const defs = [];
      const taken = new Set();
      const defName = (prefix, n) => {
        let d = prefix + asciiName(n);
        while (taken.has(d)) d += '_';
        taken.add(d);
        return d;
      };
      let frame = 2;
      const local = (size) => { frame += size; return 'bp-' + frame; };
      const np = fn.params.length;
      const hidden = !fn.isMain && fn.returnType === 'string';
      const copies = [];
      const kindText = (p) => (A.isArrayType(p.type) ? tr('asmAddr') : p.byRef ? 'InOut, ' + tr('asmAddr') : 'In');

      fn.params.forEach((p, i) => {
        if (!p.name || ctx.vars.has(p.name)) return;
        const at = 'bp+' + (4 + 2 * (np - 1 - i));
        const d = defName('v_', p.name);
        if (A.isArrayType(p.type)) { ctx.vars.set(p.name, { type: p.type, mode: 'arr', def: d }); defs.push([d, at, p.name + ': ' + typeName(p.type) + ' (' + kindText(p) + ')']); }
        else if (p.byRef) { ctx.vars.set(p.name, { type: p.type, mode: 'ref', def: d }); defs.push([d, at, p.name + ': ' + typeName(p.type) + ' (' + kindText(p) + ')']); }
        else if (p.type === 'string') {
          const pd = defName('p_', p.name);
          defs.push([pd, at, p.name + ': ' + typeName(p.type) + ' (In, ' + tr('asmAddr') + ')']);
          ctx.vars.set(p.name, { type: 'string', mode: 'buf', def: d });
          defs.push([d, local(STRSIZE), p.name + ': ' + tr('asmCopy')]);
          copies.push([pd, d, p.name]);
        } else { ctx.vars.set(p.name, { type: p.type, mode: 'val', def: d }); defs.push([d, at, p.name + ': ' + typeName(p.type) + ' (In)']); }
      });
      if (!fn.isMain && fn.returnType !== 'void') {
        const d = defName('v_', 'result');
        if (fn.returnType === 'string') { ctx.vars.set('result', { type: 'string', mode: 'ref', def: d }); defs.push([d, 'bp+' + (4 + 2 * np), 'result: ' + typeName('string') + ' (' + tr('asmAddr') + ')']); }
        else { ctx.vars.set('result', { type: 'integer', mode: 'val', def: d }); defs.push([d, local(2), 'result: ' + typeName('integer')]); }
      }
      for (const [n, v] of scope) {
        if (v.kind !== 'decl' || ctx.vars.has(n)) continue;
        const d = defName('v_', n);
        if (A.isArrayType(v.type)) { ctx.vars.set(n, { type: v.type, mode: 'arr', def: d }); defs.push([d, local(2), n + ': ' + typeName(v.type) + ' (' + tr('asmAddr') + ')']); }
        else if (v.type === 'string') { ctx.vars.set(n, { type: 'string', mode: 'buf', def: d }); defs.push([d, local(STRSIZE), n + ': ' + typeName('string')]); }
        else { ctx.vars.set(n, { type: 'integer', mode: 'val', def: d }); defs.push([d, local(2), n + ': ' + typeName('integer')]); }
      }

      // Rumpf erzeugen (danach ist bekannt, wie viel Hilfsspeicher nötig ist)
      if (!fn.isMain && fn.returnType !== 'void') {
        ctx.lines.push('');
        Cm(ctx, 'result = ' + oneLine(fn.resultInit));
        assignTo(ctx, { k: 'id', name: 'result' }, tryParse(fn.resultInit));
      }
      seq(ctx, fn.body);
      for (let i = 1; i <= ctx.wmax; i++) defs.push(['wrd_' + i, local(2), tr('asmTemp')]);
      for (let i = 1; i <= ctx.tmax; i++) defs.push(['tmp_' + i, local(STRSIZE), tr('asmTemp')]);
      if (frame % 2) frame++;

      const name = procName.get(fn);
      const head = [];
      const sig = fn.isMain ? tr('fn.main') : tr('fn.sub') + ' ' + fn.name + '(' + fn.params.map((p) => (p.byRef && !A.isArrayType(p.type) ? 'InOut ' : '') + (p.name || '?') + ': ' + typeName(p.type)).join(', ') + ')' +
        (fn.returnType !== 'void' ? ' → ' + typeName(fn.returnType) : '');
      head.push('; ' + '='.repeat(70), '; ' + sig, '; ' + '='.repeat(70));
      head.push('%define ' + 'hp_mark'.padEnd(14) + ' bp-2'.padEnd(10) + ' ; ' + tr('asmHeapMark'));
      for (const [d, at, c] of defs) head.push('%define ' + d.padEnd(14) + ' ' + at.padEnd(9) + ' ; ' + c);
      head.push('');
      head.push(name + ':');
      const H = (ins, c) => head.push(TAB + (c ? ins.padEnd(28) + '; ' + c : ins));
      H('push bp', tr('asmPrologue'));
      H('mov bp, sp');
      H('sub sp, ' + frame, tr('asmFrameSize'));
      H('call check_stack');
      H('mov di, sp');
      H('mov cx, ' + frame / 2);
      H('xor ax, ax');
      H('rep stosw', tr('asmZeroFrame'));
      H('mov ax, [heap_ptr]');
      H('mov [hp_mark], ax', tr('asmHeapMark'));
      for (const [pd, d, pn] of copies) {
        H('mov si, [' + pd + ']', pn + ': ' + tr('asmCopy'));
        H('lea di, [' + d + ']');
        H('call str_copy');
      }
      const tail = [''];
      const T = (ins, c) => tail.push(TAB + (c ? ins.padEnd(28) + '; ' + c : ins));
      T('mov ax, [hp_mark]', tr('asmEpilogue'));
      T('mov [heap_ptr], ax');
      if (!fn.isMain && fn.returnType === 'integer') T('mov ax, [' + ctx.vars.get('result').def + ']', 'result → ax');
      T('mov sp, bp');
      T('pop bp');
      const pbytes = 2 * (np + (hidden ? 1 : 0));
      T(pbytes ? 'ret ' + pbytes : 'ret', pbytes ? tr('asmRetN') : '');
      procs.push(head.concat(ctx.lines, tail).join('\n'));
    }

    const mainFn = program.fns.find((f) => f.isMain);
    genFunction(mainFn);
    for (const f of program.fns) if (!f.isMain) genFunction(f);

    // ------------------------------------------------------------ Zusammenbau
    lit('true'); lit('false');
    const out = [];
    out.push('; ' + tr('asmHeader1'));
    out.push('; ' + tr('asmHeader2'));
    out.push('; ' + tr('asmHeader3'));
    out.push('');
    out.push(TAB + 'cpu 8086');
    out.push(TAB + 'org 100h');
    out.push('');
    out.push('start:');
    out.push(TAB + 'cld'.padEnd(28) + '; ' + tr('asmStart'));
    out.push(TAB + 'call main');
    out.push(TAB + 'mov ax, 4C00h'.padEnd(28) + '; ' + tr('asmExit'));
    out.push(TAB + 'int 21h');
    out.push('');
    out.push(procs.join('\n\n'));
    out.push('');
    out.push(runtime(tr, lit));
    out.push('');
    out.push('; ' + '='.repeat(70));
    out.push('; ' + tr('asmData'));
    out.push('; ' + '='.repeat(70));
    for (const [, v] of lits) out.push((v.label + ':').padEnd(10) + 'db ' + [String(v.bytes.length)].concat(dbList(v.bytes)).join(', '));
    out.push('');
    out.push('heap_ptr:'.padEnd(14) + 'dw heap_start');
    out.push('heap_start:'.padEnd(36) + '; ' + tr('asmHeapStart'));
    return out.join('\n') + '\n';
  }

      '.end:   cmp dh, 0',
