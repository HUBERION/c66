      if (s.k === 'len') {
        const o = strip(s.obj);
        const at = A.isArrayType(typeOf(ctx, o)) ? cellOf(ctx, val(ctx, o)) : textAddr(ctx, o);
        if (at === '#0') return '#0';
        return '@' + at;   // Länge steht an der Adresse
      }
      if (typeOf(ctx, s) === 'string') return textAddr(ctx, s);
      return String(evalInto(ctx, s));
    }

    /** Operand in eine direkte Zelle bringen (für @…/$@…). */
    function cellOf(ctx, op) {
      if (/^\d+$/.test(op)) return op;
      if (op === '#0') return '#0';
      const t = String(temp(ctx));
      emit('S', [t, op]);
      return t;
    }

    /** Element a[i]: Adresse = Basis + i + 1 */
    function elemOperand(ctx, s) {
      const t = temp(ctx);
      emit('S', [String(t), val(ctx, s.obj)]);
      const i = strip(s.index);
      if (i.k === 'num' && Number.isInteger(i.v)) emit('A', [String(t), '#' + (i.v + 1)]);
      else { emit('A', [String(t), val(ctx, i)]); emit('A', [String(t), '#1']); }
      return '@' + t;
    }

    /** Operand, dessen Wert die Adresse der Variablen/des Elements ist (für InOut). */
    function addrValue(ctx, a) {
      const s = strip(a);
      if (s.k === 'idx') return elemOperand(ctx, s).slice(1);
      if (s.k !== 'id') return '#0';
      if (ctx.fn.isMain) return '#' + (mainCell.get(s.name) ?? 0);
      return varOperand(ctx, s.name).slice(1);
    }

    // ------------------------------------------------------------ Texte

    /** Aufruf einer eingebauten Text-Routine; Ergebnis (RV) in eine neue Zwischenzelle. */
    function helperCall(ctx, name, args) {
      usedHelp.add(name);
      if (args[0] !== undefined) emit('S', [reg('X1'), args[0]]);
      if (args[1] !== undefined) emit('S', [reg('X2'), args[1]]);
      const id = callSites.length + 1;
      const back = newLabel('zu');
      callSites.push(back);
      emit('S', [reg('HR'), '#' + id]);
      emit('G', [HELP[name]]);
      label(back);
      const t = String(temp(ctx));
      emit('S', [t, reg('RV')]);
      return t;
    }

    /** Textkonstante auf der Halde ablegen → Zelle mit der Adresse. */
    function textLiteral(ctx, v) {
      if (v === '') return '#0';
      usesHeap = true;
      const hp = reg('HP');
      const t = String(temp(ctx));
      emit('S', [t, hp]);
      emit('S', ['$@' + hp, lit(v)]);
      emit('A', [hp, '#' + ([...v].length + 1)]);
      return t;
    }

    function parts(ctx, ast) {
      const s = strip(ast);
      if (s.k === 'bin' && s.op === '+' && typeOf(ctx, s) === 'string') return parts(ctx, s.a).concat(parts(ctx, s.b));
      return [s];
    }

    /** Text-Ausdruck → Zelle (oder #0) mit der Adresse des Texts. */
    function textAddr(ctx, a) {
      const ps = parts(ctx, a);
      let acc = null;
      for (const p of ps) {
        const t = typeOf(ctx, p);
        let x;
        if (p.k === 'str') x = textLiteral(ctx, p.v);
        else if (t === 'string') x = cellOf(ctx, p.k === 'id' ? varOperand(ctx, p.name) : p.k === 'idx' ? elemOperand(ctx, p) : '#0');
        else if (t === 'bool') {
          const yes = newLabel(), no = newLabel(), end = newLabel();
          x = String(temp(ctx));
          condJump(ctx, p, yes, no);
          label(yes); emit('S', [x, textLiteral(ctx, 'true')]); emit('G', [end]);
          label(no); emit('S', [x, textLiteral(ctx, 'false')]);
          label(end);
        } else x = helperCall(ctx, 'num', [val(ctx, p)]);
        if (x === '#0' && acc !== null) continue;
        acc = acc === null ? x : helperCall(ctx, 'cat', [acc, x]);
      }
      return acc === null ? '#0' : acc;
    }

    /** Text ausgeben, Stück für Stück (ohne neuen Text zu bauen). */
    function emitTextOut(ctx, a) {
      for (const p of parts(ctx, a)) {
        const t = typeOf(ctx, p);
        if (p.k === 'str') { if (p.v !== '') emit('O', [lit(p.v)]); }
        else if (t === 'string') {
          const c = cellOf(ctx, p.k === 'id' ? varOperand(ctx, p.name) : elemOperand(ctx, p));
          if (c !== '#0') emit('O', ['$@' + c]);
        } else if (t === 'bool') {
          const yes = newLabel(), no = newLabel(), end = newLabel();
          condJump(ctx, p, yes, no);
          label(yes); emit('O', ['"true"']); emit('G', [end]);
          label(no); emit('O', ['"false"']);
          label(end);
        } else emit('O', [val(ctx, p)]);
      }
    }

    // ------------------------------------------------------------ Zahlen

    /** Ausdruck in eine neue Hilfszelle rechnen; liefert die Zellnummer. */
    function evalInto(ctx, a) {
      const s = strip(a);
      const t = temp(ctx);
      const T = String(t);
      if (s.k === 'bin' && '+-*'.includes(s.op) && typeOf(ctx, s) !== 'string') {
        const fa = strip(s.a), fb = strip(s.b);
        // Kommazahl-Faktor: x * 1.25 → x * 5 / 4
        if (s.op === '*' && (isFrac(fa) || isFrac(fb))) {
          const [f, other] = isFrac(fb) ? [fb, s.a] : [fa, s.b];
          const [p, q] = fraction(f.raw);
          emit('S', [T, val(ctx, other)]);
          emit('M', [T, '#' + p]);
          divmod(ctx, t, '#' + q, '/', t);
          return t;
        }
        emit('S', [T, val(ctx, s.a)]);
        emit({ '+': 'A', '-': 'R', '*': 'M' }[s.op], [T, val(ctx, s.b)]);
        return t;
      }
      if (s.k === 'bin' && (s.op === '/' || s.op === '%')) {
        emit('S', [T, val(ctx, s.a)]);
        const d = temp(ctx);
        emit('S', [String(d), val(ctx, s.b)]);
        divmod(ctx, t, String(d), s.op, t);
        return t;
      }
      if (s.k === 'un' && s.op === '-') { emit('S', [T, val(ctx, s.a)]); emit('N', [T]); return t; }
      if (s.k === 'un' && s.op === '+') { emit('S', [T, val(ctx, s.a)]); return t; }
      if (s.k === 'num') { emit('S', [T, '#' + Math.trunc(s.v)]); return t; }
      if (typeOf(ctx, s) === 'string') { unsupported.push(tr('mgNoTextNum')); emit('S', [T, '#0']); return t; }
      // Wahrheitswert → 0/1
      const yes = newLabel(), no = newLabel();
      emit('S', [T, '#0']);
      condJump(ctx, s, yes, no);
      label(yes);
      emit('S', [T, '#1']);
      label(no);
      return t;
    }

    const isFrac = (s) => s.k === 'num' && !Number.isInteger(s.v);
    function fraction(raw) {
      const [i, d = ''] = String(raw).split('.');
      const p = parseInt(i + d, 10), q = Math.pow(10, d.length);
      const gcd = (x, y) => (y ? gcd(y, x % y) : x);
      const g = gcd(Math.abs(p), q);
      return [p / g, q / g];
    }

    /** Springt nach neg, wenn Zelle x < 0, sonst nach nonneg (x bleibt unverändert). */
    function signJump(ctx, x, neg, nonneg) {
      const p = String(temp(ctx)), q = String(temp(ctx));
      const loop = newLabel();
      emit('S', [p, x], tr('mgCmtSign'));
      emit('S', [q, x]);
      label(loop);
      emit('E', [q, nonneg]);
      emit('E', [p, neg]);
      emit('A', [p, '#1']);
      emit('R', [q, '#1']);
      emit('G', [loop]);
    }

    /** dst := a / d bzw. a % d (a steht schon in Zelle aCell, d ist ein Operand). Schneidet ab wie C. */
    function divmod(ctx, aCell, d, op, dst) {
      const a = String(aCell);
      const b = String(temp(ctx)), q = String(temp(ctx)), sq = String(temp(ctx)), sr = String(temp(ctx)), diff = String(temp(ctx));
      const aPos = newLabel(), bChk = newLabel(), bPos = newLabel(), loop = newLabel(), done = newLabel(), aNeg = newLabel(), bNeg = newLabel();
      emit('S', [b, d], op === '/' ? tr('mgCmtDiv') : tr('mgCmtMod'));
      emit('E', [b, END]);                // Division durch 0 → Programmende
      emit('S', [q, '#0']);
      emit('S', [sq, '#1']);
      emit('S', [sr, '#1']);
      signJump(ctx, a, aNeg, aPos);
      label(aNeg);
      emit('N', [a]);
      emit('N', [sq]);
      emit('N', [sr]);
      label(aPos);
      signJump(ctx, b, bNeg, bChk);
      label(bNeg);
      emit('N', [b]);
      emit('N', [sq]);
      label(bChk);
      label(loop);
      emit('S', [diff, a]);
      emit('R', [diff, b]);
      signJump(ctx, diff, done, bPos);
      label(bPos);
      emit('S', [a, diff]);
      emit('A', [q, '#1']);
      emit('G', [loop]);
      label(done);
      if (op === '/') { emit('M', [q, sq]); emit('S', [String(dst), q]); }
      else { emit('M', [a, sr]); emit('S', [String(dst), a]); }
    }

    /** Bedingung als Sprünge. */
    function condJump(ctx, a, yes, no) {
      const s = strip(a);
      if (s.k === 'bin' && s.op === '&&') { const mid = newLabel(); condJump(ctx, s.a, mid, no); label(mid); condJump(ctx, s.b, yes, no); return; }
      if (s.k === 'bin' && s.op === '||') { const mid = newLabel(); condJump(ctx, s.a, yes, mid); label(mid); condJump(ctx, s.b, yes, no); return; }
      if (s.k === 'un' && s.op === '!') { condJump(ctx, s.a, no, yes); return; }
      if (s.k === 'bin' && ['==', '!=', '<', '<=', '>', '>='].includes(s.op)) {
        if (typeOf(ctx, s.a) === 'string' || typeOf(ctx, s.b) === 'string') { textCond(ctx, s, yes, no); return; }
        const swap = s.op === '<=' || s.op === '>';
        const d = temp(ctx), D = String(d);
        emit('S', [D, val(ctx, swap ? s.b : s.a)]);
        emit('R', [D, val(ctx, swap ? s.a : s.b)]);
        switch (s.op) {
          case '==': emit('E', [D, yes]); emit('G', [no]); return;
          case '!=': emit('E', [D, no]); emit('G', [yes]); return;
          case '<': case '>': signJump(ctx, D, yes, no); return;      // a−b < 0  bzw.  b−a < 0
          default: signJump(ctx, D, no, yes); return;                 // <=: b−a < 0 → falsch;  >=: a−b < 0 → falsch
        }
      }
      if (typeOf(ctx, s) === 'string') {
        // Text als Bedingung: nicht leer
        const c = textAddr(ctx, s);
        if (c === '#0') { emit('G', [no]); return; }
        const n = String(temp(ctx));
        emit('S', [n, '@' + c]);
        emit('E', [n, no]);
        emit('G', [yes]);
        return;
      }
      const v = val(ctx, s);
      if (v.startsWith('#')) { emit('G', [v === '#0' ? no : yes]); return; }
      emit('E', [v, no]);
      emit('G', [yes]);
    }

    /** Textvergleich über txt_cmp (Ergebnis −1, 0, 1). */
    function textCond(ctx, s, yes, no) {
      const isEmpty = (x) => strip(x).k === 'str' && strip(x).v === '';
      // Vergleich mit "" → nur die Länge prüfen
      if ((s.op === '==' || s.op === '!=') && (isEmpty(s.a) || isEmpty(s.b))) {
        const other = isEmpty(s.a) ? s.b : s.a;
        const c = textAddr(ctx, other);
        if (c === '#0') { emit('G', [s.op === '==' ? yes : no]); return; }
        const n = String(temp(ctx));
        emit('S', [n, '@' + c]);
        emit('E', [n, s.op === '==' ? yes : no]);
        emit('G', [s.op === '==' ? no : yes]);
        return;
      }
      const a = textAddr(ctx, s.a), b = textAddr(ctx, s.b);
      const r = helperCall(ctx, 'cmp', [a, b]);
      switch (s.op) {
        case '==': emit('E', [r, yes]); emit('G', [no]); return;
        case '!=': emit('E', [r, no]); emit('G', [yes]); return;
        case '<': emit('A', [r, '#1']); emit('E', [r, yes]); emit('G', [no]); return;   // −1 → kleiner
        case '>=': emit('A', [r, '#1']); emit('E', [r, no]); emit('G', [yes]); return;
        case '>': emit('R', [r, '#1']); emit('E', [r, yes]); emit('G', [no]); return;   // 1 → größer
        default: emit('R', [r, '#1']); emit('E', [r, no]); emit('G', [yes]); return;    // <=
      }
    }

    function condFrom(ctx, src, yes, no) {
      const ast = tryParse(src);
      if (!ast) { emit('G', [yes]); return; }
      condJump(ctx, ast, yes, no);
    }

    /** Wert in eine Variable/ein Element schreiben. */
    function store(ctx, targetSrc, ast) {
      const tgt = tryTarget(targetSrc);
      if (!tgt) return;
      const tt = typeOf(ctx, tgt);
      if (tt === 'string') {
        const v = ast ? textAddr(ctx, ast) : '#0';
        emit('S', [lval(ctx, tgt), v]);
        return;
      }
      if (!ast) { emit('S', [lval(ctx, tgt), '#0']); return; }
      const s = strip(ast);
      if (typeOf(ctx, s) === 'string') { unsupported.push(tr('mgNoTextNum')); note('; ' + tr('mgSkipped')); return; }
      // x = x + y → A x y (bei Zellen des Hauptprogramms)
      if (tgt.k === 'id' && ctx.fn.isMain && s.k === 'bin' && '+-*'.includes(s.op) && strip(s.a).k === 'id' && strip(s.a).name === tgt.name &&
          !isFrac(strip(s.b))) {
        const y = val(ctx, s.b);
        emit({ '+': 'A', '-': 'R', '*': 'M' }[s.op], [String(mainCell.get(tgt.name)), y]);
        return;
      }
      const v = val(ctx, s);
      emit('S', [lval(ctx, tgt), v]);
    }

    function lval(ctx, tgt) {
      if (tgt.k === 'id') return varOperand(ctx, tgt.name);
      return elemOperand(ctx, tgt);
    }

    // ------------------------------------------------------------ Anweisungen

    function genSeq(ctx, seq) { for (const n of seq) genStmt(ctx, n); }

    function genStmt(ctx, n) {
      ctx.tmp = 0;
      const head = (txt) => note('; ' + txt + (n.comment ? '   (' + n.comment.replace(/\s+/g, ' ') + ')' : ''));
      switch (n.kind) {
        case 'comment':
          for (const l of String(n.text || '').split('\n')) note('; ' + l);
          return;
        case 'decl': {
          if (A.isArrayType(n.vtype)) {
            head(n.name + ' = ' + tr('mgNewArray', n.length));
            usesHeap = true;
            const len = tryParse(n.length);
            const hp = reg('HP');
            const lenV = len ? val(ctx, len) : '#0';
            const t = String(temp(ctx));
            emit('S', [t, lenV]);
            emit('S', ['@' + hp, t], tr('mgCmtLen'));
            emit('S', [lval(ctx, { k: 'id', name: n.name }), hp]);
            emit('A', [hp, t]);
            emit('A', [hp, '#1']);
            return;
          }
          head(n.name + ' = ' + (String(n.init || '').trim() || (n.vtype === 'string' ? '""' : '0')));
          store(ctx, n.name, tryParse(n.init));
          return;
        }
        case 'assign':
          head(n.target + ' = ' + n.expr);
          store(ctx, n.target, tryParse(n.expr));
          return;
        case 'input': {
          const tgt = tryTarget(n.target);
          head(tr('mgInput', n.target) + (String(n.prompt || '').trim() ? '  ' + n.prompt : ''));
          if (!tgt) return;
          const p = tryParse(n.prompt);
          if (p) emitTextOut(ctx, p);
          ctx.tmp = 0;
          if (typeOf(ctx, tgt) === 'string') {
            usesHeap = true;
            const hp = reg('HP');
            const t = String(temp(ctx));
            emit('S', [t, hp]);
            emit('I', ['$@' + t], tr('mgCmtReadText'));
            emit('A', [hp, '@' + t]);
            emit('A', [hp, '#1']);
            emit('S', [lval(ctx, tgt), t]);
          } else emit('I', [lval(ctx, tgt)]);
          return;
        }
        case 'output': {
          head(tr('mgOutput', n.expr));
          const ast = tryParse(n.expr);
          if (ast) emitTextOut(ctx, ast);
          emit('O', ['"\\n"']);
          return;
        }
        case 'if': {
          head(tr('mgIf', n.cond));
          const yes = newLabel(), no = newLabel(), end = newLabel();
          condFrom(ctx, n.cond, yes, no);
          label(yes);
          genSeq(ctx, n.then);
          if (n.else && n.else.length) { emit('G', [end]); label(no); genSeq(ctx, n.else); label(end); }
          else { label(no); }
          return;
        }
        case 'while': {
          head(tr('mgWhile', n.cond));
          const top = newLabel(), body = newLabel(), end = newLabel();
          label(top);
          ctx.tmp = 0;
          condFrom(ctx, n.cond, body, end);
          label(body);
          genSeq(ctx, n.body);
          emit('G', [top]);
          label(end);
          return;
        }
        case 'until': {
          head(tr('mgUntil', n.cond));
          const top = newLabel(), end = newLabel();
          label(top);
          genSeq(ctx, n.body);
          ctx.tmp = 0;
          condFrom(ctx, n.cond, end, top);
          label(end);
          return;
        }
        case 'for': {
          head(tr('mgFor', n.counter, n.from, n.to, String(n.step || '1').trim() || '1'));
          const top = newLabel(), body = newLabel(), end = newLabel();
          store(ctx, n.counter, tryParse(n.from));
          const stepAst = tryParse(n.step) || { k: 'num', v: 1, raw: '1' };
          const lit1 = A.literalValue(stepAst);
          const k = tryParse(n.counter), to = tryParse(n.to) || { k: 'num', v: 0, raw: '0' };
          label(top);
          ctx.tmp = 0;
          if (typeof lit1 === 'number') condJump(ctx, { k: 'bin', op: lit1 >= 0 ? '<=' : '>=', a: k, b: to }, body, end);
          else {
            const pos = newLabel(), neg = newLabel();
            const s = String(temp(ctx));
            emit('S', [s, val(ctx, stepAst)]);
            signJump(ctx, s, neg, pos);
            label(pos);
            ctx.tmp = 0;
            condJump(ctx, { k: 'bin', op: '<=', a: k, b: to }, body, end);
            label(neg);
            ctx.tmp = 0;
            condJump(ctx, { k: 'bin', op: '>=', a: k, b: to }, body, end);
          }
          label(body);
          genSeq(ctx, n.body);
          ctx.tmp = 0;
          store(ctx, n.counter, { k: 'bin', op: '+', a: k, b: stepAst });
          emit('G', [top]);
          label(end);
          return;
        }
        case 'switch': {
          head(tr('mgSwitch', n.expr));
          const sel = tryParse(n.expr);
          if (!sel) return;
          const isText = typeOf(ctx, sel) === 'string';
          const end = newLabel();
          const labels = n.cases.map(() => newLabel());
          const other = newLabel();
          const sv = isText ? textAddr(ctx, sel) : cellOf(ctx, val(ctx, sel));
          n.cases.forEach((c, i) => {
            const v = tryParse(c.value) || { k: isText ? 'str' : 'num', v: isText ? '' : 0, raw: '0' };
            if (isText) {
              const r = helperCall(ctx, 'cmp', [sv, textAddr(ctx, v)]);
              emit('E', [r, labels[i]]);
            } else {
              const d = String(temp(ctx));
              emit('S', [d, sv]);
              emit('R', [d, val(ctx, v)]);
              emit('E', [d, labels[i]]);
            }
          });
          emit('G', [other]);
          n.cases.forEach((c, i) => { label(labels[i]); genSeq(ctx, c.body); emit('G', [end]); });
          label(other);
          if (n.else) genSeq(ctx, n.else);
          label(end);
          return;
        }
        case 'call': {
          const callee = program.fns.find((f) => !f.isMain && f.name === n.fn);
          head(tr('mgCall', (n.target && n.target.trim() ? n.target + ' = ' : '') + (n.fn || '?') + '(' + n.args.join(', ') + ')'));
          if (!callee) return;
          usesStack = true;
          const fr = frames.get(callee);
          const SP = reg('SP'), FP = reg('FP');
          // Argumente in den neuen Rahmen schreiben (ab SP)
          callee.params.forEach((p, i) => {
            ctx.tmp = 0;
            const src = tryParse(n.args[i] || '') || { k: 'num', v: 0, raw: '0' };
            const v = A.isArrayType(p.type) ? val(ctx, src) : p.byRef ? addrValue(ctx, src) : p.type === 'string' ? textAddr(ctx, src) : val(ctx, src);
            const a = String(temp(ctx));
            emit('S', [a, SP]);
            emit('A', [a, '#' + fr.slot.get(p.name)]);
            emit('S', ['@' + a, v], p.name);
          });
          ctx.tmp = 0;
          const id = callSites.length + 1;
          const back = newLabel('zu');
          callSites.push(back);
          const a = String(temp(ctx));
          emit('S', ['@' + SP, '#' + id], tr('mgCmtRetId'));
          emit('S', [a, SP]);
          emit('A', [a, '#1']);
          emit('S', ['@' + a, FP], tr('mgCmtSaveFp'));
          emit('S', [FP, SP]);
          emit('A', [SP, '#' + fr.size]);
          emit('G', [fnLabel.get(callee.name)]);
          label(back);
          if (callee.returnType !== 'void' && n.target && n.target.trim()) {
            ctx.tmp = 0;
            const tgt = tryTarget(n.target);
            if (!tgt) return;
            const tt = typeOf(ctx, tgt);
            if (tt === callee.returnType) emit('S', [lval(ctx, tgt), reg('RV')]);
            else if (tt === 'string') { const t = helperCall(ctx, 'num', [reg('RV')]); emit('S', [lval(ctx, tgt), t]); }
            else unsupported.push(tr('mgNoTextNum'));
          }
          return;
        }
        default: return;
      }
    }

    // ------------------------------------------------------------ Eingebaute Text-Routinen

    function genHelpers() {
      const K = (i) => String(K0 + i);
      const X1 = reg('X1'), X2 = reg('X2'), RV = reg('RV'), HP = reg('HP'), HR = reg('HR'), RID = reg('RID');
      const ret = () => { emit('S', [RID, HR]); emit('G', [RET]); };
      const hctx = { helper: true, tmp: 0 };
      if (usedHelp.has('cat')) {
        note(''); note('; ' + tr('mgHelpCat'));
        const [r, d, s, k] = [K(0), K(1), K(2), K(3)];
        const l1 = newLabel(), l2 = newLabel(), l3 = newLabel(), l4 = newLabel();
        label(HELP.cat);
        emit('S', [r, HP]);
        emit('S', [k, '@' + X1]);
        emit('A', [k, '@' + X2]);
        emit('S', ['@' + r, k], tr('mgCmtLen'));
        emit('S', [d, r]);
        emit('S', [s, X1]);
        emit('S', [k, '@' + X1]);

    function notExpr() {
      if (isName('not')) { next(); return { k: 'not', a: notExpr() }; }
      return comparison();
    }
    function comparison() {
      const left = arith();
      const ops = [], rights = [];
      for (;;) {
        let op = null;
        if (peek().t === 'op' && ['<', '>', '==', '>=', '<=', '!='].includes(peek().v)) op = next().v;
        else if (isName('in')) { next(); op = 'in'; }
        else if (isName('not') && peek(1).t === 'name' && peek(1).v === 'in') { next(); next(); op = 'not in'; }
        else if (isName('is')) { next(); op = eat('not') ? 'is not' : 'is'; }
        if (!op) break;
        ops.push(op);
        rights.push(arith());
      }
      return ops.length ? { k: 'cmp', left, ops, rights } : left;
    }
    function arith() {
      let a = term();
      while (peek().t === 'op' && (peek().v === '+' || peek().v === '-')) { const op = next().v; a = { k: 'bin', op, a, b: term() }; }
      return a;
    }
    function term() {
      let a = factor();
      while (peek().t === 'op' && ['*', '/', '//', '%', '@'].includes(peek().v)) { const op = next().v; a = { k: 'bin', op, a, b: factor() }; }
      return a;
    }
    function factor() {
      if (peek().t === 'op' && (peek().v === '-' || peek().v === '+' || peek().v === '~')) { const op = next().v; return { k: 'un', op, a: factor() }; }
      return power();
    }
    function power() {
      const a = atomExpr();
      if (eat('**')) return { k: 'bin', op: '**', a, b: factor() };
      return a;
    }
    function atomExpr() {
      let e = atom();
      for (;;) {
        if (isOp('(')) {
          next();
          const args = [], kwargs = {};
          while (!isOp(')')) {
            if (peek().t === 'name' && peek(1).t === 'op' && peek(1).v === '=') {
              const k = next().v; next();
              kwargs[k] = namedExpr();
            } else {
              if (isOp('*') || isOp('**')) next();
              const a = namedExpr();
              if (isName('for')) { comprehensionSkip(); args.push({ k: 'comp' }); break; }
              args.push(a);
            }
            if (!eat(',')) break;
          }
          expect(')');
          e = { k: 'call', func: e, args, kwargs };
        } else if (isOp('[')) {
          next();
          let index;
          if (isOp(':')) { index = sliceRest(null); } else {
            index = namedExpr();
            if (isOp(':')) index = sliceRest(index);
          }
          expect(']');
          e = { k: 'sub', value: e, index };
        } else if (isOp('.')) {
          next();
          const n = next();
          e = { k: 'attr', value: e, name: n.v };
        } else {
          return e;
        }
      }
    }
    function sliceRest(lower) {
      next();
      let upper = null;
      if (!isOp(']') && !isOp(':')) upper = namedExpr();
      if (eat(':') && !isOp(']')) namedExpr();
      return { k: 'slice', lower, upper };
    }
    function comprehensionSkip() {
      let d = 0;
      while (peek().t !== 'eof') {
        if (peek().t === 'op' && '([{'.includes(peek().v)) d++;
        if (peek().t === 'op' && ')]}'.includes(peek().v)) { if (d === 0) return; d--; }
        next();
      }
    }
    function atom() {
      const tk = next();
      switch (tk.t) {
        case 'num': {
          if (/j$/.test(tk.v)) throw new PyError('pyComplex', [], tk.line);
          let raw = tk.v;
          if (/^0[xXbBoO]/.test(raw)) raw = String(Number(raw));
          if (raw.endsWith('.')) raw = raw.slice(0, -1);
          return { k: 'num', v: Number(raw), raw };
        }
        case 'str': case 'fstr': {
          let parts = [tk];
          while (peek().t === 'str' || peek().t === 'fstr') parts.push(next());
          if (parts.every((x) => x.t === 'str')) return { k: 'str', v: parts.map((x) => x.v).join('') };
          return { k: 'fstr', parts: parts.flatMap((x) => (x.t === 'str' ? [x.v] : fstringParts(x, tk.line))) };
        }
        case 'name':
          if (tk.v === 'True') return { k: 'bool', v: true };
          if (tk.v === 'False') return { k: 'bool', v: false };
          if (tk.v === 'None') return { k: 'none' };
          return { k: 'name', id: tk.v };
        case 'op':
          if (tk.v === '(') {
            if (eat(')')) return { k: 'tuple', elts: [] };
            const e = namedExpr();
            if (isName('for')) { comprehensionSkip(); expect(')'); return { k: 'comp' }; }
            if (isOp(',')) {
              const elts = [e];
              while (eat(',')) { if (isOp(')')) break; elts.push(namedExpr()); }
              expect(')');
              return { k: 'tuple', elts };
            }
            expect(')');
            return { k: 'paren', e };
          }
          if (tk.v === '[') {
            const elts = [];
            while (!isOp(']')) {
              const e = namedExpr();
              if (isName('for')) { comprehensionSkip(); expect(']'); return { k: 'comp' }; }
              elts.push(e);
              if (!eat(',')) break;
            }
            expect(']');
            return { k: 'list', elts };
          }
          if (tk.v === '{') {
            let d = 1;
            while (d && peek().t !== 'eof') { const t = next(); if (t.t === 'op' && t.v === '{') d++; if (t.t === 'op' && t.v === '}') d--; }
            return { k: 'dict' };
          }
          break;
        default: break;
      }
      throw new PyError('pyUnexpected', [describe(tk)], tk.line);
    }

    function fstringParts(tk, line) {
      // f"…{ausdruck[:format]}…" → Teile: Text | Ausdruck
      const raw = tk.triple ? tk.v : tk.v;
      const out = [];
      let i = 0, buf = '';
      while (i < raw.length) {
        const c = raw[i];
        if (c === '{' && raw[i + 1] === '{') { buf += '{'; i += 2; continue; }
        if (c === '}' && raw[i + 1] === '}') { buf += '}'; i += 2; continue; }
        if (c === '{') {
          if (buf) { out.push(buf); buf = ''; }
          let d = 1, j = i + 1, inner = '';
          while (j < raw.length && d) {
            if (raw[j] === '{') d++;
            if (raw[j] === '}') { d--; if (!d) break; }
            inner += raw[j];
            j++;
          }
          // Formatangabe / Konvertierung abtrennen
          let depth2 = 0, cut = inner.length;
          for (let k = 0; k < inner.length; k++) {
            const ch = inner[k];
            if ('([{'.includes(ch)) depth2++;
            if (')]}'.includes(ch)) depth2--;
            if (depth2 === 0 && (ch === ':' || (ch === '!' && inner[k + 1] !== '='))) { cut = k; break; }
          }
          const exprSrc = inner.slice(0, cut).trim().replace(/=$/, '');
          const sub = parse(exprSrc).body;
          const st = sub[0];
          if (!st || st.k !== 'expr') throw new PyError('pyFString', [], line);
          out.push(st.value);
          i = j + 1;
          continue;
        }
        buf += c;
        i++;
      }
      if (buf) out.push(buf);
      return out;
    }

    const body = [];
    while (peek().t !== 'eof') {
      if (peek().t === 'dedent') { next(); continue; }
      body.push(...statement());
    }
    return { body, lines };
  }

  function describe(tk) {
    if (!tk) return '…';
    if (tk.t === 'newline') return '⏎';
    if (tk.t === 'eof') return '…';
    if (tk.t === 'indent' || tk.t === 'dedent') return '⇥';
    if (tk.t === 'str' || tk.t === 'fstr') return '"' + tk.v + '"';
    return String(tk.v);
  }

  // ================================================================ Übersetzung

  const S = (...st) => ({ type: 'Statements', statements: st });
  const DEFAULT = { integer: '0', string: '""' };
  const PY_TYPES = { int: 'integer', float: 'integer', bool: 'integer', str: 'string' };

  function annType(a) {
    if (!a) return null;
    if (a.k === 'name') return PY_TYPES[a.id] || (a.id === 'list' ? 'integer[]' : null);
    if (a.k === 'sub' && a.value.k === 'name' && (a.value.id === 'list' || a.value.id === 'List')) {
      const inner = annType(a.index);
      return inner && !inner.endsWith('[]') ? inner + '[]' : 'integer[]';
    }
    if (a.k === 'str') return annType({ k: 'name', id: a.v });
    return null;
  }

  const isArray = (t) => typeof t === 'string' && t.endsWith('[]');
  const strip = (e) => (e && e.k === 'paren' ? strip(e.e) : e);
  const isCallTo = (e, name) => { const x = strip(e); return x && x.k === 'call' && x.func.k === 'name' && x.func.id === name; };

  /** Stark vereinfachte Typableitung für Python-Ausdrücke. */
  function pyType(e, scope, fns) {
    e = strip(e);
    if (!e) return '?';
    switch (e.k) {
      case 'num': case 'bool': return 'integer';
      case 'str': case 'fstr': return 'string';
      case 'name': return scope.get(e.id) || '?';
      case 'list': {
        if (!e.elts.length) return 'integer[]';
        const t = pyType(e.elts[0], scope, fns);
        return (t === 'string' ? 'string' : 'integer') + '[]';
      }
      case 'bin': {
        if (e.op === '*' && (strip(e.a).k === 'list' || strip(e.b).k === 'list')) return pyType(strip(e.a).k === 'list' ? e.a : e.b, scope, fns);
        if (e.op === '+') {
          const a = pyType(e.a, scope, fns), b = pyType(e.b, scope, fns);
          if (a === 'string' || b === 'string') return 'string';
          if (isArray(a)) return a;
          return a === '?' && b === '?' ? '?' : 'integer';
        }
        if (e.op === '*' && (pyType(e.a, scope, fns) === 'string' || pyType(e.b, scope, fns) === 'string')) return 'string';
        return 'integer';
      }
      case 'un': case 'not': case 'cmp': case 'boolop': return 'integer';
      case 'sub': { const t = pyType(e.value, scope, fns); return isArray(t) ? t.slice(0, -2) : t === 'string' ? 'string' : '?'; }
      case 'ifexp': { const t = pyType(e.body, scope, fns); return t !== '?' ? t : pyType(e.orelse, scope, fns); }
      case 'call': {
        if (e.func.k === 'name') {
          const n = e.func.id;
          if (['int', 'float', 'len', 'abs', 'round', 'min', 'max', 'sum', 'bool', 'ord'].includes(n)) return 'integer';
          if (['str', 'input', 'chr'].includes(n)) return 'string';
          const f = fns.get(n);
          if (f) return f.returnType === 'void' ? '?' : f.returnType;
        }
        if (e.func.k === 'attr' && ['upper', 'lower', 'strip', 'capitalize', 'title', 'replace'].includes(e.func.name)) return 'string';
        return '?';
      }
      default: return '?';
    }
  }

  function convert(src, opts = {}) {
    const tr = opts.t || ((k) => k);
    const mod = parse(src);
    const warnings = [];
    const warn = (line, key, args) => warnings.push({ line, key, args: args || [] });

    // -------------------------------------------------------- Funktionen sammeln
    const defs = mod.body.filter((s) => s.k === 'def');
    let mainBody = mod.body.filter((s) => s.k !== 'def');
    const fns = new Map();
    for (const d of defs) {
      if (fns.has(d.name)) warn(d.line, 'pyRedefined', [d.name]);
      fns.set(d.name, {
        def: d, name: d.name,
        params: d.params.map((p) => ({ name: p.name, type: annType(p.ann) })),
        returnType: d.returns ? (annType(d.returns) || (d.returns.k === 'none' ? 'void' : null)) : null,
        scope: new Map()
      });
    }

    // Muster "def main(): …" + main() bzw. if __name__ == "__main__": main()
    const isMainCall = (s) => s.k === 'expr' && isCallTo(s.value, 'main') && !s.value.args.length;
    const isGuard = (s) => s.k === 'if' && s.test.k === 'cmp' && strip(s.test.left).k === 'name' && strip(s.test.left).id === '__name__' && s.body.every((x) => isMainCall(x) || x.k === 'comment' || x.k === 'pass');
    const realMain = mainBody.filter((s) => s.k !== 'comment' && s.k !== 'import' && s.k !== 'pass');
    if (fns.has('main') && realMain.length && realMain.every((s) => isMainCall(s) || isGuard(s))) {
      const m = fns.get('main');
      mainBody = mainBody.filter((s) => s.k === 'comment').concat(m.def.body);
      fns.delete('main');
    } else if (fns.has('main')) {
      // Name "main" ist im Blockbild reserviert
      const m = fns.get('main');
      fns.delete('main');
      m.name = 'main_';
      fns.set('main_', m);
      warn(m.def.line, 'pyRenamed', ['main', 'main_']);
    }

    // -------------------------------------------------------- Typen ableiten (mehrere Durchläufe)
    const mainScope = new Map();
    const scanAssign = (body, scope, fnInfo) => {
      const visit = (list) => {
        for (const s of list) {
          if (s.k === 'assign') {
            const v = s.value;
            for (const tg of s.targets) {
              const t = strip(tg);
              if (t.k === 'name' && !scope.has(t.id)) {
                let ty = annType(s.ann) || pyType(v, scope, fns);
                if (isCallTo(v, 'input')) ty = 'string';
                if (ty !== '?') scope.set(t.id, ty);
              }
              if (t.k === 'tuple' && strip(v).k === 'tuple') {
                t.elts.forEach((x, i) => { const xx = strip(x); if (xx.k === 'name' && !scope.has(xx.id)) { const ty = pyType(strip(v).elts[i], scope, fns); if (ty !== '?') scope.set(xx.id, ty); } });
              }
            }
          }
          if (s.k === 'aug') { const t = strip(s.target); if (t.k === 'name' && !scope.has(t.id)) { const ty = pyType(s.value, scope, fns); if (ty !== '?') scope.set(t.id, ty); } }
          if (s.k === 'for') {
            const t = strip(s.target);
            if (t.k === 'name' && !scope.has(t.id)) {
              if (isCallTo(s.iter, 'range')) scope.set(t.id, 'integer');
              else { const it = pyType(s.iter, scope, fns); if (isArray(it)) scope.set(t.id, it.slice(0, -2)); }
            }
          }
          if (s.k === 'if') { visit(s.body); visit(s.orelse); }
          if (s.k === 'while' || s.k === 'for') visit(s.body);
          if (s.k === 'match') s.cases.forEach((c) => visit(c.body));
          if (s.k === 'return' && fnInfo && s.value && !fnInfo.returnTypeFixed) {
            const ty = pyType(s.value, scope, fns);
            if (ty !== '?' && !fnInfo.returnType) fnInfo.returnType = isArray(ty) ? 'integer' : ty;
          }
        }
      };
      visit(body);
    };
    const callSites = (body, scope) => {
      const walkE = (e) => {
        if (!e || typeof e !== 'object') return;
        if (e.k === 'call' && e.func.k === 'name' && fns.has(e.func.id)) {
          const f = fns.get(e.func.id);
          e.args.forEach((a, i) => {
            if (f.params[i] && !f.params[i].type) { const ty = pyType(a, scope, fns); if (ty !== '?') f.params[i].type = ty; }
          });
        }
        for (const v of Object.values(e)) {
          if (Array.isArray(v)) v.forEach(walkE); else if (v && typeof v === 'object') walkE(v);
        }
      };
      body.forEach(walkE);
    };
    for (const f of fns.values()) f.returnTypeFixed = !!f.returnType;
    for (let round = 0; round < 4; round++) {
      scanAssign(mainBody, mainScope, null);
      callSites(mainBody, mainScope);
      for (const f of fns.values()) {
        f.params.forEach((p) => { if (p.type) f.scope.set(p.name, p.type); });
        scanAssign(f.def.body, f.scope, f);
        callSites(f.def.body, f.scope);
      }
    }
    for (const f of fns.values()) {
      f.params.forEach((p) => { if (!p.type) p.type = 'integer'; f.scope.set(p.name, p.type); });
      const hasValueReturn = (list) => list.some((s) => (s.k === 'return' && s.value) || (s.body && hasValueReturn(s.body)) || (s.orelse && hasValueReturn(s.orelse)) || (s.cases && s.cases.some((c) => hasValueReturn(c.body))));
      if (!f.returnType) f.returnType = hasValueReturn(f.def.body) ? 'integer' : 'void';
      if (isArray(f.returnType)) { warn(f.def.line, 'pyReturnArray', [f.name]); f.returnType = 'void'; }
    }

    // -------------------------------------------------------- Anweisungen übersetzen

    function makeCtx(scope, fnInfo) {
      return { scope, fn: fnInfo, declared: new Set(fnInfo ? fnInfo.params.map((p) => p.name) : []), top: [], tmp: 0, pre: null, depth: 0 };
    }

    const unsupportedNote = (s) => ({ type: 'CommentStatement', comment: tr('pyNote', s.line, (mod.lines[s.line - 1] || '').trim()) });

    function tmpName(ctx, base) {
      let n;
      do { n = (base || tr('pyTmp')) + (++ctx.tmp); } while (ctx.scope.has(n) || ctx.declared.has(n));
      return n;
    }

    /** Variable deklarieren (falls nötig). Auf oberster Ebene direkt, sonst am Anfang des Unterprogramms. */
    function ensureDecl(ctx, name, type, out, init) {
      if (ctx.declared.has(name)) return false;
      ctx.declared.add(name);
      const ty = type && type !== '?' ? type : (ctx.scope.get(name) || 'integer');
      if (!ctx.scope.has(name)) ctx.scope.set(name, ty);
      if (isArray(ty)) {
        const d = { type: 'DeclarationStatement', variableType: ty, variableName: name, arrayLength: init != null ? init : '0', isArray: true };
        (ctx.depth === 0 ? out : ctx.top).push(d);
        return true;
      }
      if (ctx.depth === 0 && init != null) {
        out.push({ type: 'DeclarationStatement', variableType: ty, variableName: name, initializationValue: init, isArray: false });
        return true;
      }
      ctx.top.push({ type: 'DeclarationStatement', variableType: ty, variableName: name, initializationValue: DEFAULT[ty] || '0', isArray: false });
      return false;
    }

    function flush(ctx, out) {
      if (ctx.pre && ctx.pre.length) out.push(...ctx.pre);
      ctx.pre = null;
    }
    const pre = (ctx) => (ctx.pre = ctx.pre || []);

    // ---- Ausdrücke in Blockbild-Syntax
    const PREC = { or: 1, and: 2, '==': 3, '!=': 3, '<': 4, '<=': 4, '>': 4, '>=': 4, '+': 5, '-': 5, '*': 6, '/': 6, '%': 6 };

    function ex(ctx, e, line, minPrec = 0) {
      e = e && e.k === 'paren' ? { k: 'paren', e: e.e } : e;
      const wrap = (s, prec) => (prec < minPrec ? '(' + s + ')' : s);
      switch (e.k) {
        case 'paren': return ex(ctx, e.e, line, minPrec);
        case 'num': return e.raw;
        case 'bool': return e.v ? '1' : '0';
        case 'none': warn(line, 'pyNone'); return '0';
        case 'str': return JSON.stringify(e.v);
        case 'name':
          if (ctx.fn && e.id === 'result' && ctx.fn.returnType !== 'void') return 'result';
          return e.id;
        case 'fstr': {
          const parts = e.parts.map((p) => (typeof p === 'string' ? JSON.stringify(p) : ex(ctx, p, line, 6)));
          if (!parts.length) return '""';
          if (typeof e.parts[0] !== 'string') parts.unshift('""');
          return wrap(mergeLiterals(parts).join(' + '), 5);
        }
        case 'un':
          if (e.op === '~') { warn(line, 'pyOperator', ['~']); return ex(ctx, e.a, line, 7); }
          return wrap(e.op + ex(ctx, e.a, line, 7), 7);
        case 'not': return wrap('!' + ex(ctx, e.a, line, 7), 7);
        case 'boolop': {
          const op = e.op === 'and' ? '&&' : '||';
          return wrap(ex(ctx, e.a, line, PREC[e.op]) + ' ' + op + ' ' + ex(ctx, e.b, line, PREC[e.op] + 1), PREC[e.op]);
        }
        case 'cmp': {
          const parts = [];
          let left = e.left;
          e.ops.forEach((op, i) => {
            const right = e.rights[i];
            let o = op;
            if (op === 'is') o = '==';
            else if (op === 'is not') o = '!=';
            else if (op === 'in' || op === 'not in') {
              const r = strip(right);
              if (r.k === 'tuple' || r.k === 'list') {
                const one = r.elts.map((x) => ex(ctx, left, line, 4) + (op === 'in' ? ' == ' : ' != ') + ex(ctx, x, line, 4));
                parts.push(one.length ? '(' + one.join(op === 'in' ? ' || ' : ' && ') + ')' : (op === 'in' ? '0' : '1'));
                left = right;
                return;
              }
              warn(line, 'pyOperator', [op]);
              o = '==';
            }
            parts.push(ex(ctx, left, line, 4) + ' ' + o + ' ' + ex(ctx, right, line, 4));
            left = right;
          });
          return parts.length > 1 ? wrap(parts.join(' && '), 2) : wrap(parts[0], 3);
        }
        case 'bin': {
          if (e.op === '//') {
            const a = ex(ctx, e.a, line, 6), b = ex(ctx, e.b, line, 7);
            return wrap('(' + a + ' - ' + a + ' % ' + b + ') / ' + b, 6);
          }
          if (e.op === '**') {
            const n = strip(e.b);
            if (n.k === 'num' && Number.isInteger(n.v) && n.v >= 0 && n.v <= 4) {
              if (n.v === 0) return '1';
              const base = ex(ctx, e.a, line, 7);
              return wrap(Array(n.v).fill(base).join(' * '), 6);
            }
            warn(line, 'pyOperator', ['**']);
            return wrap(ex(ctx, e.a, line, 6) + ' * ' + ex(ctx, e.a, line, 7), 6);
          }
          if (e.op === '*' && (pyType(e.a, ctx.scope, fns) === 'string' || pyType(e.b, ctx.scope, fns) === 'string')) {
            warn(line, 'pyOperator', ['"text" * n']);
          }
          if (e.op === '@') { warn(line, 'pyOperator', ['@']); return '0'; }
          const prec = PREC[e.op];
          if (e.op === '+' && pyType(e, ctx.scope, fns) === 'string') {
            // Python: Text + Zahl ist ein Fehler, im Blockbild erlaubt – Reihenfolge bleibt erhalten
            return wrap(ex(ctx, e.a, line, prec) + ' + ' + ex(ctx, e.b, line, prec + 1), prec);
          }
          return wrap(ex(ctx, e.a, line, prec) + ' ' + e.op + ' ' + ex(ctx, e.b, line, prec + 1), prec);
        }
        case 'sub': {
          const v = strip(e.value);
          if (e.index.k === 'slice') { warn(line, 'pySlice'); return ex(ctx, e.value, line, 7); }
          const idx = strip(e.index);
          const base = ex(ctx, e.value, line, 8);
          if (v.k !== 'name') warn(line, 'pyComplexIndex');
          if (pyType(e.value, ctx.scope, fns) === 'string') warn(line, 'pyStringIndex', [base]);
          if (idx.k === 'un' && idx.op === '-' && strip(idx.a).k === 'num') return base + '[' + base + '.length - ' + strip(idx.a).raw + ']';
          return base + '[' + ex(ctx, e.index, line, 0) + ']';
        }
        case 'call': return exCall(ctx, e, line, minPrec);
        case 'ifexp': {
          const ty = pyType(e, ctx.scope, fns);
          const t = tmpName(ctx);
          ctx.scope.set(t, ty === '?' ? 'integer' : ty);
          ctx.declared.add(t);
          ctx.top.push({ type: 'DeclarationStatement', variableType: ctx.scope.get(t), variableName: t, initializationValue: DEFAULT[ctx.scope.get(t)] || '0', isArray: false });
          const c = ex(ctx, e.test, line);
          const a = ex(ctx, e.body, line);
          const b = ex(ctx, e.orelse, line);
          pre(ctx).push({ type: 'IfStatement', condition: c, thenStatements: S({ type: 'AssignmentStatement', variableName: t, assignmentValue: a }), elseStatements: S({ type: 'AssignmentStatement', variableName: t, assignmentValue: b }) });
          return t;
        }
        case 'attr':
          warn(line, 'pyAttr', [e.name]);
          return ex(ctx, e.value, line, minPrec);
        case 'list': case 'tuple': case 'dict': case 'comp': case 'slice':
          warn(line, 'pyCollection');
          return '0';
        case 'wild': return '_';
        default:
          warn(line, 'pyExpr');
          return '0';
      }
    }

    function hoistValue(ctx, type, line, build) {
      const t = tmpName(ctx);
      const ty = type === '?' ? 'integer' : type;
      ctx.scope.set(t, ty);
      ctx.declared.add(t);
      ctx.top.push({ type: 'DeclarationStatement', variableType: ty, variableName: t, initializationValue: DEFAULT[ty] || '0', isArray: false });
      build(t, pre(ctx));
      return t;
    }

    function exCall(ctx, e, line, minPrec) {
      const f = e.func;
      if (f.k === 'attr') {
        const m = f.name;
        const obj = ex(ctx, f.value, line, 8);
        if (m === 'upper' || m === 'lower' || m === 'strip' || m === 'capitalize' || m === 'title') { warn(line, 'pyMethod', [m]); return obj; }
        if (m === 'format') { warn(line, 'pyMethod', [m]); return obj; }
        warn(line, 'pyMethod', [m]);
        return obj;
      }
      if (f.k !== 'name') { warn(line, 'pyExpr'); return '0'; }
      const n = f.id;
      const args = e.args;
      switch (n) {
        case 'len': {
          const a = strip(args[0]);
          if (a && a.k === 'name') return a.id + '.length';
          return '(' + ex(ctx, args[0], line, 8) + ').length';
        }
        case 'int': case 'float': case 'round': case 'bool':
          if (!args.length) return '0';
          if (isCallTo(args[0], 'input')) {
            return hoistValue(ctx, 'integer', line, (t, list) => list.push({ type: 'InputStatement', prompt: promptOf(ctx, args[0], line), variableName: t }));
          }
          if (n === 'round') warn(line, 'pyRound');
          if (n === 'int' && pyType(args[0], ctx.scope, fns) === 'integer') {
            // int(a / b) → ganzzahlige Division
            const a = strip(args[0]);
            if (a.k === 'bin' && a.op === '/') return ex(ctx, { k: 'bin', op: '//', a: a.a, b: a.b }, line, minPrec);
          }
          return ex(ctx, args[0], line, minPrec);
        case 'str':
          if (!args.length) return '""';
          if (pyType(args[0], ctx.scope, fns) === 'string') return ex(ctx, args[0], line, minPrec);
          return (minPrec > 5 ? '(' : '') + '"" + ' + ex(ctx, args[0], line, 6) + (minPrec > 5 ? ')' : '');
        case 'input':
          return hoistValue(ctx, 'string', line, (t, list) => list.push({ type: 'InputStatement', prompt: promptOf(ctx, e, line), variableName: t }));
        case 'abs':
          return hoistValue(ctx, 'integer', line, (t, list) => {
            list.push({ type: 'AssignmentStatement', variableName: t, assignmentValue: ex(ctx, args[0], line) });
            list.push({ type: 'IfStatement', condition: t + ' < 0', thenStatements: S({ type: 'AssignmentStatement', variableName: t, assignmentValue: '-' + t }), elseStatements: null });
          });
        case 'min': case 'max': {
          if (args.length < 2) { warn(line, 'pyBuiltin', [n]); return '0'; }
          const vals = args.map((a) => ex(ctx, a, line));
          return hoistValue(ctx, pyType(args[0], ctx.scope, fns), line, (t, list) => {
            list.push({ type: 'AssignmentStatement', variableName: t, assignmentValue: vals[0] });
            for (const v of vals.slice(1)) {
              list.push({ type: 'IfStatement', condition: v + (n === 'min' ? ' < ' : ' > ') + t, thenStatements: S({ type: 'AssignmentStatement', variableName: t, assignmentValue: v }), elseStatements: null });
            }
          });
        }
        case 'print':
          warn(line, 'pyExpr');
          return '""';
        default: {
          const fi = fns.get(n);
          if (!fi) { warn(line, 'pyBuiltin', [n]); return '0'; }
          const callArgs = args.map((a) => ex(ctx, a, line));
          if (fi.returnType === 'void') { warn(line, 'pyVoidValue', [n]); }
          return hoistValue(ctx, fi.returnType === 'void' ? 'integer' : fi.returnType, line, (t, list) => {
            list.push({ type: 'FunctionCallStatement', functionName: fi.name, parameters: callArgs.map((value) => ({ value })), variableName: fi.returnType === 'void' ? undefined : t });
          });
        }
      }
    }

    /** Benachbarte Textliterale zusammenfassen: "a" + " " + x → "a " + x */
    function mergeLiterals(parts) {
      const out = [];
      const isLit = (s) => /^"(?:[^"\\]|\\.)*"$/.test(s);
      for (const part of parts) {
        if (out.length && isLit(part) && isLit(out[out.length - 1]) && !(out.length === 1 && part === '""')) {
          out[out.length - 1] = JSON.stringify(JSON.parse(out[out.length - 1]) + JSON.parse(part));
        } else out.push(part);
      }
      if (out.length > 1 && out[0] === '""' && isLit(out[1])) out.shift();
      return out;
    }

    function promptOf(ctx, inputCall, line) {
      const c = strip(inputCall);
      if (!c.args.length) return '""';
      return ex(ctx, c.args[0], line);
    }

    // ---- "liefert immer" – für frühe returns
    const alwaysReturns = (list) => {
      const last = list.filter((s) => s.k !== 'comment' && s.k !== 'pass').slice(-1)[0];
      if (!last) return false;
      if (last.k === 'return') return true;
      if (last.k === 'if') return alwaysReturns(last.body) && last.orelse.length > 0 && alwaysReturns(last.orelse);
      return false;
    };

    /** Liste von Python-Anweisungen → Blockbild-Anweisungen. */
    function block(ctx, list, tail) {
      const out = [];
      for (let i = 0; i < list.length; i++) {
        const s = list[i];
        const rest = list.slice(i + 1);
        // if … : return …   (ohne else) gefolgt von weiteren Anweisungen → Rest wird zum SONST-Zweig
        if (ctx.fn && s.k === 'if' && !s.orelse.length && alwaysReturns(s.body) && rest.some((x) => x.k !== 'comment')) {
          stmt(ctx, Object.assign({}, s, { orelse: rest }), out, tail);
          return out;
        }
        stmt(ctx, s, out, tail && i === list.length - 1);
      }
      return out;
    }

    function sub(ctx, list, tail) {
      ctx.depth++;
      const r = block(ctx, list, tail);
      ctx.depth--;
      return S(...r);
    }

    function assignTo(ctx, target, valueSrc, valueType, out, line) {
      const t = strip(target);
      if (t.k === 'name') {
        const isNew = !ctx.declared.has(t.id);
        if (isNew) {
          flush(ctx, out);
          if (ensureDecl(ctx, t.id, valueType, out, valueSrc)) return;
        }
        flush(ctx, out);
        out.push({ type: 'AssignmentStatement', variableName: t.id, assignmentValue: valueSrc });
        return;
      }
      if (t.k === 'sub') {
        const tg = ex(ctx, t, line);
        flush(ctx, out);
        out.push({ type: 'AssignmentStatement', variableName: tg, assignmentValue: valueSrc });
        return;
      }
      flush(ctx, out);
      warn(line, 'pyTarget');
      out.push({ type: 'CommentStatement', comment: tr('pyNote', line, (mod.lines[line - 1] || '').trim()) });
    }

    function stmt(ctx, s, out, tail) {
      const line = s.line;
      switch (s.k) {
        case 'comment':
          out.push({ type: 'CommentStatement', comment: s.text });
          return;
        case 'pass': case 'skip': return;
        case 'import':
          return;
        case 'annotation': {
          const t = strip(s.target);
          if (t.k === 'name') ensureDecl(ctx, t.id, annType(s.ann), out, null);
          return;
        }
        case 'expr': return exprStmt(ctx, s, out);
        case 'assign': return assignStmt(ctx, s, out);
        case 'aug': {
          const t = strip(s.target);
          const tgt = t.k === 'name' ? t.id : ex(ctx, t, line);
          const op = s.op === '//' ? '//' : s.op;
          const val = ex(ctx, { k: 'bin', op, a: s.target, b: { k: 'paren', e: s.value } }, line);
          if (t.k === 'name' && !ctx.declared.has(t.id)) { warn(line, 'pyUndeclared', [t.id]); ensureDecl(ctx, t.id, pyType(s.value, ctx.scope, fns), out, null); }
          flush(ctx, out);
          out.push({ type: 'AssignmentStatement', variableName: tgt, assignmentValue: val });
          return;
        }
        case 'if': {
          const cond = ex(ctx, s.test, line);
          flush(ctx, out);
          out.push({
            type: 'IfStatement', condition: cond,
            thenStatements: sub(ctx, s.body, tail),
            elseStatements: s.orelse.length ? sub(ctx, s.orelse, tail) : null
          });
          return;
        }
        case 'while': return whileStmt(ctx, s, out);
        case 'for': return forStmt(ctx, s, out);
        case 'match': return matchStmt(ctx, s, out, tail);
        case 'return': {
          if (!ctx.fn) { warn(line, 'pyReturnMain'); return; }
          if (!tail) warn(line, 'pyEarlyReturn');
          if (!s.value) return;
          if (ctx.fn.returnType === 'void') { warn(line, 'pyReturnVoid'); return; }
          const v = ex(ctx, s.value, line);
          flush(ctx, out);
          out.push({ type: 'AssignmentStatement', variableName: 'result', assignmentValue: v });
          return;
        }
        case 'break': case 'continue':
          warn(line, 'pyBreak', [s.k]);
          out.push(unsupportedNote(s));
          return;
        case 'def':
          warn(line, 'pyNestedDef', [s.name]);
          out.push(unsupportedNote(s));
          return;
        default:
          if (s.reason) warn(line, s.reason);
          else warn(line, 'pyStatement', [(s.text || '').split(/[\s:(]/)[0] || '?']);
          out.push(unsupportedNote(s));
      }
    }

    function exprStmt(ctx, s, out) {
      const e = strip(s.value);
      const line = s.line;
      if (e.k === 'str') return; // Docstring
      if (e.k === 'call' && e.func.k === 'name' && e.func.id === 'print') {
        const sepArg = e.kwargs.sep;
        const sep = sepArg ? (strip(sepArg).k === 'str' ? strip(sepArg).v : ' ') : ' ';
        if (e.kwargs.end && !(strip(e.kwargs.end).k === 'str' && strip(e.kwargs.end).v === '\n')) warn(line, 'pyPrintEnd');
        const parts = e.args.map((a) => ex(ctx, a, line, e.args.length > 1 ? 6 : 0));
        let text;
        if (!parts.length) text = '""';
        else {
          const joined = [];
          parts.forEach((x, i) => { if (i > 0 && sep) joined.push(JSON.stringify(sep)); joined.push(x); });
          // ohne Trennzeichen würden zwei Zahlen addiert statt aneinandergehängt
          if (joined.length > 1 && !sep && pyType(e.args[0], ctx.scope, fns) !== 'string') joined.unshift('""');
          text = mergeLiterals(joined).join(' + ');
        }
        flush(ctx, out);
        out.push({ type: 'OutputStatement', outputString: text });
        return;
      }
      if (e.k === 'call' && e.func.k === 'name' && e.func.id === 'input') {
        const t = tmpName(ctx);
        ctx.scope.set(t, 'string');
        ctx.declared.add(t);
        ctx.top.push({ type: 'DeclarationStatement', variableType: 'string', variableName: t, initializationValue: '""', isArray: false });
        out.push({ type: 'InputStatement', prompt: promptOf(ctx, e, line), variableName: t });
        return;
      }
      if (e.k === 'call' && e.func.k === 'name' && fns.has(e.func.id)) {
        const fi = fns.get(e.func.id);
        const args = e.args.map((a) => ex(ctx, a, line));
        flush(ctx, out);
        out.push({ type: 'FunctionCallStatement', functionName: fi.name, parameters: args.map((value) => ({ value })) });
        return;
      }
      if (e.k === 'call' && e.func.k === 'attr') {
        warn(line, 'pyMethod', [e.func.name]);
        out.push(unsupportedNote(s));
        return;
      }
      warn(line, 'pyExprStmt');
      out.push(unsupportedNote(s));
    }

    function assignStmt(ctx, s, out) {
      const line = s.line;
      const v = strip(s.value);
      for (const target of s.targets) {
        const t = strip(target);
        // Tupel-Zuweisung: a, b = b, a
        if (t.k === 'tuple') {
          if (v.k !== 'tuple' || v.elts.length !== t.elts.length) { warn(line, 'pyTarget'); out.push(unsupportedNote(s)); return; }
          const temps = v.elts.map((x) => {
            const ty = pyType(x, ctx.scope, fns);
            const val = ex(ctx, x, line);
            const tmp = tmpName(ctx);
            ctx.scope.set(tmp, ty === '?' ? 'integer' : ty);
            ctx.declared.add(tmp);
            ctx.top.push({ type: 'DeclarationStatement', variableType: ctx.scope.get(tmp), variableName: tmp, initializationValue: DEFAULT[ctx.scope.get(tmp)] || '0', isArray: false });
            flush(ctx, out);
            out.push({ type: 'AssignmentStatement', variableName: tmp, assignmentValue: val });
            return tmp;
          });
          t.elts.forEach((x, i) => assignTo(ctx, x, temps[i], ctx.scope.get(temps[i]), out, line));
          continue;
        }
        // Eingabe
        const isInput = isCallTo(v, 'input');
        const isNumInput = v.k === 'call' && v.func.k === 'name' && ['int', 'float'].includes(v.func.id) && v.args[0] && isCallTo(v.args[0], 'input');
        if ((isInput || isNumInput) && t.k !== 'tuple') {
          const prompt = promptOf(ctx, isInput ? v : v.args[0], line);
          const ty = isInput ? (annType(s.ann) || 'string') : 'integer';
          if (t.k === 'name') {
            if (!ctx.declared.has(t.id)) {
              if (ctx.scope.get(t.id) && ctx.scope.get(t.id) !== ty && isInput) {
                // erst Text, später Zahl: als Zahl einlesen
              }
              ensureDecl(ctx, t.id, ctx.scope.get(t.id) || ty, out, DEFAULT[ctx.scope.get(t.id) || ty]);
            }
            if (isInput && ctx.scope.get(t.id) === 'integer') warn(line, 'pyInputNumber', [t.id]);
          }
          flush(ctx, out);
          out.push({ type: 'InputStatement', prompt, variableName: t.k === 'name' ? t.id : ex(ctx, t, line) });
          continue;
        }
        // Listen
        const listInfo = listLiteral(v);
        if (listInfo && t.k === 'name') {
          const elemType = listInfo.elemType || (ctx.scope.get(t.id) && isArray(ctx.scope.get(t.id)) ? ctx.scope.get(t.id).slice(0, -2) : 'integer');
          const arrType = elemType + '[]';
          if (ctx.declared.has(t.id)) { warn(line, 'pyListReassign', [t.id]); out.push(unsupportedNote(s)); continue; }
          let length;
          if (listInfo.kind === 'repeat') length = ex(ctx, listInfo.count, line);
          else length = String(listInfo.items.length);
          if (listInfo.kind === 'literal' && !listInfo.items.length) warn(line, 'pyEmptyList', [t.id]);
          ctx.scope.set(t.id, arrType);
          ctx.declared.add(t.id);
          flush(ctx, out);
          (ctx.depth === 0 ? out : ctx.top).push({ type: 'DeclarationStatement', variableType: arrType, variableName: t.id, arrayLength: length, isArray: true });
          if (listInfo.kind === 'literal') {
            listInfo.items.forEach((x, i) => {
              const val = ex(ctx, x, line);
              flush(ctx, out);
              out.push({ type: 'AssignmentStatement', variableName: t.id + '[' + i + ']', assignmentValue: val });
            });
          } else {
            const fill = strip(listInfo.value);
            const isDefault = (fill.k === 'num' && fill.v === 0) || (fill.k === 'str' && fill.v === '') || (fill.k === 'bool' && !fill.v);
            if (!isDefault) {
              const ix = tmpName(ctx, 'i');
              ctx.scope.set(ix, 'integer');
              ctx.declared.add(ix);
              ctx.top.push({ type: 'DeclarationStatement', variableType: 'integer', variableName: ix, initializationValue: '0', isArray: false });
              const val = ex(ctx, listInfo.value, line);
              flush(ctx, out);
              out.push({ type: 'ForStatement', counterName: ix, fromValue: '0', toValue: t.id + '.length - 1', counterShift: '+1', loopStatements: S({ type: 'AssignmentStatement', variableName: t.id + '[' + ix + ']', assignmentValue: val }) });
            }
          }
          continue;
        }
        // Funktionsaufruf mit Ergebnis
        if (v.k === 'call' && v.func.k === 'name' && fns.has(v.func.id) && t.k === 'name') {
          const fi = fns.get(v.func.id);
          const args = v.args.map((a) => ex(ctx, a, line));
          if (!ctx.declared.has(t.id)) ensureDecl(ctx, t.id, fi.returnType === 'void' ? 'integer' : fi.returnType, out, null);
          flush(ctx, out);
          if (fi.returnType === 'void') warn(line, 'pyVoidValue', [fi.name]);
          out.push({ type: 'FunctionCallStatement', functionName: fi.name, parameters: args.map((value) => ({ value })), variableName: fi.returnType === 'void' ? undefined : t.id });
          continue;
        }
        if (t.k === 'name' && ctx.fn && t.id === 'result' && ctx.fn.returnType !== 'void') warn(line, 'pyResultName');
        const ty = annType(s.ann) || pyType(v, ctx.scope, fns);
        const val = ex(ctx, s.value, line);
        assignTo(ctx, t, val, ty, out, line);
      }
    }

    function listLiteral(v) {
      v = strip(v);
      if (v.k === 'list') {
        const first = v.elts[0];
        return { kind: 'literal', items: v.elts, elemType: first ? (pyType(first, new Map(), fns) === 'string' ? 'string' : 'integer') : null };
      }
      if (v.k === 'bin' && v.op === '*') {
        const a = strip(v.a), b = strip(v.b);
        const lst = a.k === 'list' ? a : b.k === 'list' ? b : null;
        if (lst && lst.elts.length === 1) {
          const count = lst === a ? v.b : v.a;
          const value = lst.elts[0];
          return { kind: 'repeat', count, value, elemType: pyType(value, new Map(), fns) === 'string' ? 'string' : 'integer' };
        }
      }
      return null;
    }

    function whileStmt(ctx, s, out) {
      const line = s.line;
      if (s.orelse) warn(line, 'pyLoopElse');
      const test = strip(s.test);
      const isTrue = (test.k === 'bool' && test.v) || (test.k === 'num' && test.v !== 0);
      // while True: … if bedingung: break  → WIEDERHOLE … BIS bedingung
      const body = s.body.filter((x) => x.k !== 'pass');
      const last = body[body.length - 1];
      const breaksElsewhere = (list) => list.some((x) => x.k === 'break' || (x.k === 'if' && (breaksElsewhere(x.body) || breaksElsewhere(x.orelse))));
      if (isTrue && last && last.k === 'if' && !last.orelse.length && last.body.length === 1 && last.body[0].k === 'break' && !breaksElsewhere(body.slice(0, -1))) {
        const inner = sub(ctx, body.slice(0, -1), false);
        const cond = ex(ctx, last.test, last.line);
        if (ctx.pre) { warn(line, 'pyComplexCond'); flush(ctx, inner.statements); }
        out.push({ type: 'DoWhileStatement', condition: cond, loopStatements: inner });
        return;
      }
      if (breaksElsewhere(body)) warn(line, 'pyBreak', ['break']);
      const cond = ex(ctx, s.test, line);
      if (ctx.pre) warn(line, 'pyComplexCond');
      flush(ctx, out);
      out.push({ type: 'WhileStatement', condition: cond, loopStatements: sub(ctx, s.body, false) });
    }

    function forStmt(ctx, s, out) {
      const line = s.line;
      if (s.orelse) warn(line, 'pyLoopElse');
      const t = strip(s.target);
      if (t.k !== 'name') { warn(line, 'pyTarget'); out.push(unsupportedNote(s)); return; }
      const it = strip(s.iter);
      if (isCallTo(it, 'range')) {
        const a = it.args;
        let from = '0', toExpr, step = '+1', stepVal = 1;
        if (a.length === 1) toExpr = a[0];
        else { from = ex(ctx, a[0], line); toExpr = a[1]; }
        if (a.length >= 3) {
          const st = strip(a[2]);
          const lit = st.k === 'num' ? st.v : (st.k === 'un' && st.op === '-' && strip(st.a).k === 'num' ? -strip(st.a).v : null);
          if (lit === null) { warn(line, 'pyRangeStep'); stepVal = 1; step = ex(ctx, a[2], line); }
          else { stepVal = lit; step = (lit > 0 ? '+' : '') + lit; }
        }
        const te = strip(toExpr);
        let to;
        const d = stepVal > 0 ? -1 : 1;
        if (te.k === 'num' && Number.isInteger(te.v)) to = String(te.v + d);
        else if (te.k === 'bin' && (te.op === '+' || te.op === '-') && strip(te.b).k === 'num' && Number.isInteger(strip(te.b).v)) {
          // n + 1 → n,  n + 2 → n + 1,  n - 1 → n - 2
          const c = (te.op === '+' ? 1 : -1) * strip(te.b).v + d;
          const base = ex(ctx, te.a, line, 5);
          to = c === 0 ? base : base + (c > 0 ? ' + ' + c : ' - ' + (-c));
        } else to = ex(ctx, toExpr, line, 5) + (d < 0 ? ' - 1' : ' + 1');
        if (!ctx.declared.has(t.id)) { ctx.scope.set(t.id, 'integer'); ctx.declared.add(t.id); ctx.top.push({ type: 'DeclarationStatement', variableType: 'integer', variableName: t.id, initializationValue: '0', isArray: false }); }
        flush(ctx, out);
        out.push({ type: 'ForStatement', counterName: t.id, fromValue: from, toValue: to, counterShift: step, loopStatements: sub(ctx, s.body, false) });
        return;
      }
      const itType = pyType(it, ctx.scope, fns);
      if (isArray(itType) && it.k === 'name') {
        const ix = tmpName(ctx, 'i');
        ctx.scope.set(ix, 'integer');
        ctx.declared.add(ix);
        ctx.top.push({ type: 'DeclarationStatement', variableType: 'integer', variableName: ix, initializationValue: '0', isArray: false });
        if (!ctx.declared.has(t.id)) {
          const et = itType.slice(0, -2);
          ctx.scope.set(t.id, et);
          ctx.declared.add(t.id);
          ctx.top.push({ type: 'DeclarationStatement', variableType: et, variableName: t.id, initializationValue: DEFAULT[et], isArray: false });
        }

<nav aria-label="Inhalt">

  <a href="#h-mg">MARTIN GOES</a>
  <a href="#h-files">Dateien</a>
  <a href="#h-python">Python übernehmen</a>
  <a href="#h-keys">Tastenkürzel</a>
</nav>
<div>
<section id="h-start">
  <h3>Erste Schritte</h3>
  <p>Ein Blockbild (Struktogramm) beschreibt ein Programm als Blöcke, die von oben nach unten ausgeführt werden.
  Zieh einen Baustein aus der Palette links in das Diagramm – die blaue Linie zeigt, wo er landet.
  Ein Klick auf einen Baustein fügt ihn direkt <b>nach dem markierten Block</b> ein (ohne Markierung am Ende).</p>
  <ul>
    <li>Felder direkt anklicken und tippen. Rot unterstrichene Felder enthalten einen Fehler – der Tooltip erklärt ihn.</li>
    <li>Blöcke lassen sich verschieben: einfach ziehen. Mit gedrückter <kbd>Strg</kbd>-Taste wird kopiert.</li>
    <li>Rechtsklick oder die Schaltfläche <b>⋯</b> neben dem markierten Block öffnet weitere Aktionen
    (Kommentar, Duplizieren, SONST hinzufügen, in WENN einpacken, Haltepunkt …).</li>
    <li>Auf Tablets: Baustein antippen zum Einfügen, <b>lange drücken</b> zum Ziehen.</li>
    <li>Leere Bereiche zeigen <code>∅</code> – ein Klick darauf fügt dort einen Block ein.</li>
  </ul>
</section>
<section id="h-blocks">
  <h3>Bausteine</h3>
  <table>
    <tr><th>Baustein</th><th>Bedeutung</th><th>Beispiel</th></tr>
    <tr><td>DEKLARATION</td><td>legt eine Variable mit Typ und Startwert an</td><td><code>Zahl : n = 0</code></td></tr>
    <tr><td>ZUWEISUNG</td><td>berechnet einen Wert und speichert ihn</td><td><code>summe = summe + i</code></td></tr>
    <tr><td>EINGABE</td><td>zeigt eine Frage und liest einen Wert ein</td><td><code>"Alter: " , alter</code></td></tr>
    <tr><td>AUSGABE</td><td>zeigt Text und Werte in der Konsole</td><td><code>"Summe: " + summe</code></td></tr>
    <tr><td>WENN … DANN … SONST</td><td>Verzweigung; SONST ist optional</td><td><code>n % 2 == 0</code></td></tr>
    <tr><td>FALLS … FALL … SONST</td><td>Mehrfachauswahl nach einem Wert</td><td><code>note</code> mit Fällen 1, 2, 3 …</td></tr>
    <tr><td>SOLANGE</td><td>prüft zuerst – 0 bis n Durchläufe</td><td><code>i &lt;= n</code></td></tr>
    <tr><td>FÜR</td><td>Zählschleife – genau n Durchläufe</td><td><code>i VON 1 BIS n SCHRITT +1</code></td></tr>
    <tr><td>WIEDERHOLE … BIS</td><td>prüft am Ende – 1 bis n Durchläufe; endet, wenn die Bedingung <b>wahr</b> ist</td><td><code>BIS note &gt;= 1 &amp;&amp; note &lt;= 5</code></td></tr>
    <tr><td>AUFRUF</td><td>startet ein Unterprogramm</td><td><code>g = ggt(a, b)</code></td></tr>
    <tr><td>KOMMENTAR</td><td>Notiz ohne Wirkung, z. B. für Eingabe – Verarbeitung – Ausgabe</td><td><code>// Verarbeitung</code></td></tr>
  </table>
  <p>SONST und FALL sind keine eigenen Anweisungen: zieh sie auf einen WENN- bzw. FALLS-Block.</p>
</section>
<section id="h-expr">
  <h3>Ausdrücke</h3>
  <p>Texte stehen in Anführungszeichen (<code>"Hallo"</code>), Zahlen ohne (<code>42</code>, <code>1.25</code>).
  <code>+</code> verbindet Texte: <code>"Du bist " + alter + " Jahre alt"</code>.</p>
  <table>
    <tr><th>Art</th><th>Ergebnis</th><th>Operatoren</th></tr>
    <tr><td>numerisch</td><td>Zahl</td><td><code>+ - * / %</code> und Klammern</td></tr>
    <tr><td>logisch</td><td>wahr/falsch</td><td><code>== != &lt; &lt;= &gt; &gt;= &amp;&amp; || !</code></td></tr>
    <tr><td>Text</td><td>Text</td><td><code>+</code> zum Verketten, <code>text.length</code></td></tr>
  </table>
  <p>Vergleiche brauchen <code>==</code>; ein einzelnes <code>=</code> gibt es nur im Zuweisungsblock.
  <code>&amp;&amp;</code> und <code>||</code> werten nur so weit aus wie nötig (Kurzschlussauswertung).</p>
</section>
<section id="h-sub">
  <h3>Unterprogramme</h3>
  <p>Mit <b>+ Unterprogramm</b> entsteht ein neuer Reiter. Oben legst du Rückgabetyp, Namen und Parameter fest.</p>
  <ul>
    <li><b>In</b> ↓ – das Unterprogramm erhält eine Kopie des Wertes (call by value).</li>
    <li><b>InOut</b> ↕ – das Unterprogramm arbeitet mit dem Original (call by reference). Beim Aufruf muss eine Variable stehen.</li>
    <li>Mit Rückgabetyp <i>Zahl</i> oder <i>Text</i> gibt es automatisch die Variable <code>result</code>; ihr Wert wird am Ende zurückgegeben. Den Startwert legst du in der ersten Zeile fest.</li>
    <li>Der AUFRUF-Block zeigt die Parameter des gewählten Unterprogramms als Felder an.</li>
  </ul>
  <p>Unterprogramme dürfen sich selbst aufrufen (Rekursion). Im Stack siehst du jeden Aufruf als eigenen Rahmen.</p>
</section>
<section id="h-arrays">
  <h3>Arrays</h3>
  <p>Typ <i>Zahl[]</i> oder <i>Text[]</i> wählen und die Länge angeben – die Länge darf auch eine Variable sein, z. B. aus einer Eingabe.
  Elemente sprichst du mit <code>werte[i]</code> an (Index von 0 bis Länge − 1), die Länge mit <code>werte.length</code>.
  Arrays werden immer als Original (InOut) übergeben.</p>
</section>
<section id="h-run">
  <h3>Ausführen und beobachten</h3>
  <ul>
    <li><b>Start</b> führt das Programm mit dem gewählten Tempo aus, <b>Schritt</b> geht Block für Block, <b>Stopp</b> bricht ab.</li>
    <li>Der gelb markierte Block wurde gerade ausgeführt. Rechts siehst du den <b>Stack</b>: jede Variable mit Wert, bei Bedarf mit Adresse (Schalter <code>0x</code>). Geänderte Werte leuchten kurz auf.</li>
    <li>InOut-Parameter erscheinen kursiv mit Pfeil auf die Originalvariable – beide haben dieselbe Adresse.</li>
    <li><b>Haltepunkte</b> (<kbd>F9</kbd> oder Kontextmenü) halten das Programm vor einem Block an.</li>
    <li>Eingaben tippst du unten in der Konsole. <kbd>Esc</kbd> bricht eine Eingabe ab – die Variable behält dann ihren Startwert. Deshalb lohnt es sich, immer sinnvolle Startwerte zu vergeben.</li>
    <li>Bei einem Laufzeitfehler (z. B. Division durch 0, Index außerhalb des Arrays) wird der Block rot markiert und erklärt.</li>
  </ul>
</section>
<section id="h-c">
  <h3>Code in 16 Sprachen</h3>
  <p>Der Reiter <b>Code</b> zeigt das Programm in der Sprache, die in der Auswahlliste gewählt ist; <i>Exportieren</i> und
  der Knopf <i>Herunterladen</i> speichern die Datei.</p>
  <table>
    <tr><th>Gruppe</th><th>Sprachen</th></tr>
    <tr><td>Verbreitet</td><td>C, C++, C#, Java, Python, JavaScript</td></tr>
    <tr><td>Skriptsprachen</td><td>bash, csh (tcsh), Lua</td></tr>
    <tr><td>Systemnah</td><td>Rust, x86-Assembler für MS-DOS (NASM, .COM-Programm)</td></tr>
    <tr><td>Klassiker</td><td>Fortran, COBOL, BASIC (QBasic-Stil), RPG IV (IBM i)</td></tr>
    <tr><td>Lehrmaschine</td><td>MARTIN GOES (siehe eigenes Kapitel)</td></tr>
  </table>
  <p>Alle Übersetzungen rechnen wie C mit ganzen Zahlen (<code>7 / 2</code> ergibt 3). Einschränkungen: x86-Assembler rechnet mit
  16 Bit (−32768 … 32767), COBOL und RPG kennen höchstens 1000 Array-Elemente, RPG gibt über <code>DSPLY</code> aus
  (höchstens 52 Zeichen pro Zeile), csh kennt keine Funktionen (Unterprogramme werden zu Sprungmarken mit <code>goto</code>),
  MARTIN GOES rechnet nur mit ganzen Zahlen (Texte ja, Kommazahlen nein).</p>
  <p>
  In C++ werden InOut-Parameter zu Referenzen (<code>int&amp; a</code>), in C# zu <code>ref</code>, in Fortran zu <code>intent(inout)</code>,
  in COBOL zu <code>BY REFERENCE</code>. JavaScript läuft mit <code>node datei.js</code>, Fortran mit <code>gfortran</code>,
  COBOL mit GnuCOBOL (<code>cobc -x datei.cob</code>; Arrays dort mit höchstens 1000 Elementen).
  In Java heißt die Klasse wie die Datei, InOut-Zahlen stehen dort in einem Array mit einem Element. In Python geben Unterprogramme
  InOut-Werte zurück (<code>x, y = tausche(x, y)</code>).</p>
  <p>Der Reiter <b>C-Code</b> zeigt das Programm als C99-Quelltext, der sich mit <code>gcc</code> übersetzen lässt.
  Dabei wird <i>Zahl</i> zu <code>int</code> (Nachkommastellen fallen weg), <i>Text</i> zu <code>char[MAX_STRING_SIZE]</code>,
  InOut-Zahlen werden zu Zeigern und Arrays bekommen eine zusätzliche Größenvariable <code>nameSize</code>.</p>
</section>
<section id="h-mg">
  <h3>MARTIN GOES</h3>
  <p>MARTIN GOES ist eine kleine Lehrmaschine (Definition: Martin): Zellen, ganze Zahlen, Texte und Sprünge.
  Der Code-Reiter übersetzt ein Blockbild in diese Sprache – so sieht man, was ein Compiler aus WENN, Schleifen,
  Unterprogrammen, Arrays und Texten macht.</p>
  <h4>Speicher</h4>
  <p>Unendlich viele Zellen 0, 1, 2, … Jede Zelle hält eine beliebig große ganze Zahl, auch negativ, und ist am Anfang 0.</p>
  <p><b>Texte</b> liegen ebenfalls in Zellen: ab Zelle a steht zuerst die Länge n, in den Zellen a+1 … a+n folgen die
  Zeichencodes (Unicode, z. B. 65 = „A“). Eine Zelle mit 0 ist also auch ein leerer Text.</p>
  <h4>Programm</h4>
  <p>Eine Liste von Befehlen mit optionalen Labels (<code>name:</code>). Die Ausführung startet beim ersten Befehl und läuft
  der Reihe nach, außer ein Sprung lenkt um. Läuft das Programm über den letzten Befehl hinaus, endet es wie bei <code>T</code>.
  Kommentare beginnen mit <code>;</code>.</p>
  <h4>Operanden</h4>
  <table>
    <tr><th>Schreibweise</th><th>Bedeutung</th></tr>
    <tr><td><code>#5</code></td><td>Konstante 5 (nur als Quelle)</td></tr>
    <tr><td><code>5</code></td><td>Zelle 5</td></tr>
    <tr><td><code>@5</code></td><td>Zelle, deren Adresse in Zelle 5 steht (indirekt)</td></tr>
    <tr><td><code>"Hallo"</code></td><td>Textkonstante (nur als Quelle); <code>\n</code> = Zeilenumbruch, <code>\"</code> = Anführungszeichen, <code>\</code> = Backslash</td></tr>
    <tr><td><code>$5</code></td><td>der Text, der ab Zelle 5 steht</td></tr>
    <tr><td><code>$@5</code></td><td>der Text ab der Adresse, die in Zelle 5 steht</td></tr>
  </table>
  <p>Das indirekte <code>@</code> macht Arrays, Stapel, Texte und „Band“ möglich.</p>
  <h4>Befehle</h4>
  <table>
    <tr><th>Befehl</th><th>Name</th><th>Wirkung</th></tr>
    <tr><td><code>M x y</code></td><td>Multiply</td><td>x := x · y</td></tr>
    <tr><td><code>A x y</code></td><td>Add</td><td>x := x + y</td></tr>
    <tr><td><code>R x y</code></td><td>Reduce</td><td>x := x − y</td></tr>
    <tr><td><code>T</code></td><td>Terminate</td><td>Programm beenden</td></tr>
    <tr><td><code>I x</code></td><td>Input</td><td>eine Zeile lesen; ganze Zahl nach x (ungültig oder Ende der Eingabe → 0)</td></tr>
    <tr><td><code>I $x</code></td><td>Input</td><td>eine Zeile als Text ab Zelle x ablegen (Länge, dann Zeichen)</td></tr>
    <tr><td><code>N x</code></td><td>Negate</td><td>x := −x</td></tr>
